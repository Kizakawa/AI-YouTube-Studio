id: philosophy_stoicism
name: Triết Học Khắc Kỷ & Nhân Sinh (Stoicism)
badge: 🏛️ Triết Học Khắc Kỷ
icon: 🏛️
description: Chủ nghĩa Khắc Kỷ (Marcus Aurelius, Seneca, Epictetus), sự bình thản
  trước bão giông cuộc đời, kỷ luật nội tâm và triết lý sống đỉnh cao.
target_audience: Người trưởng thành đang tìm kiếm sự bình yên nội tâm, vượt qua căng
  thẳng, thất bại và rèn luyện bản lĩnh thép.
script_blueprint:
  tone_of_voice: Trầm lắng, sâu sắc, thông tuệ, tĩnh tại như một vị triết gia thông
    thái, thức tỉnh nhận thức.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'Stoic Truth: ''Marcus Aurelius từng viết trong nhật ký lúc nửa đêm: Thứ hủy hoại
    bạn không phải biến cố, mà là...'''
  - 'Emotional Antidote: ''Khi cả thế giới quay lưng và bạn rơi vào bế tắc cùng cực,
    hãy nhớ 1 quy tắc khắc kỷ này...'''
  - 'Pain Inversion: ''Nỗi đau mà bạn đang chịu đựng hôm nay thực chất là bài test
    duy nhất để...'''
  - 'The Illusion of Control: ''99% năng lượng của bạn đang bị lãng phí vì bạn cố
    kiểm soát điều này...'''
  narrative_structure: Hook nỗi đau nhân sinh -> Lời dạy khắc kỷ nghìn năm -> Soi
    chiếu vào hành vi đời thực -> Câu châm ngôn đắt giá -> CTA rèn luyện bản lĩnh
    & Infinite Loop
  forbidden_words:
  - Chào các bạn yêu triết học
  - Hôm nay mình chia sẻ vài điều tích cực
  - Hãy luôn mỉm cười và vui vẻ
  - Triết học rất khó hiểu nhưng hay
  cta_templates:
  - "Khi gặp biến cố bất ngờ, phản xạ đầu tiên của bạn là (1) Im lặng quan sát hay (2) Phản ứng ngay lập tức? Bình luận 1 hoặc 2 bên dưới! 👇"
  - "Theo bạn điều khó buông bỏ nhất là (1) Lời phán xét của người khác hay (2) Kỳ vọng hoàn hảo của chính mình? 👇"
  anti_hallucination_rules:
  - Trích dẫn đúng tư tưởng của các triết gia Khắc Kỷ cổ đại (Marcus Aurelius - Meditations,
    Seneca - Letters, Epictetus - Enchiridion).
  - Tránh biến tướng thành sáo rỗng vô cảm.
  banned_lexicon: &id001
  - get rich quick
  - crypto moon
  - lottery ticket
  - gossip celebrity
  - drama
visual_aesthetics:
  art_style: Epic Classical Wisdom & Breathtaking Grand Cinema
  camera_angles: Sweeping panoramic mountain vista at sunrise, low-angle ancient marble sculpture, thoughtful philosopher writing by warm sunlight, dramatic slow tracking shot
  color_palette: Warm sunrise gold, deep Mediterranean blue, weathered alabaster marble, rich bronze, earthy olive green, natural ambient daylight
  master_prompt_prefix: masterpiece cinematic fine art film still, timeless philosophical wisdom, golden sunbeams illuminating majestic scenery, 35mm anamorphic cinematography
  master_prompt_suffix: hyper-detailed textures, breathtaking lighting, razor-sharp 8k, photorealistic vertical 9:16, no text, no watermark
  negative_prompts: blurry, low quality, cartoon, anime, modern plastic, neon club, watermark, text
  stock_video_keywords:
  - man standing mountain sunrise
  - ancient marble temple ruins
  - ocean waves crashing cliffs
  - golden sunlight through trees
  - person writing ancient book
  - hourglass falling sand close up
subtitles:
  font_family: Playfair Display, Georgia, serif
  font_weight: '700'
  font_size: 56
  primary_color: '#F8F9FA'
  highlight_color: '#E2E8F0'
  accent_color: '#CBD5E1'
  outline_color: '#0F172A'
  outline_width: 3
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: -4Hz
  bgm_vibe: melancholic emotional solo piano, gentle rainfall ambience, deep resonant
    cello
  sfx_cues:
  - gentle_thunder
  - deep_breath
  - clock_ticking
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
llm_production_blueprint:
  niche_overview: >
    Classical Stoicism (Marcus Aurelius, Seneca, Epictetus) & Timeless Inner Mastery. Combines classical marble sculptures,
    dramatic storm-crashing cliffs, golden-hour mountain solitude, and 2D Doodle philosophical metaphors.
  video_search_strategy:
    dual_track_clash_rule: >
      NEVER put 'A vs B' or 'vs' in Stoicism video searches (which triggers sigma #edit / phonk quote reels with burned-in text).
      Search ONLY single classical sculptures, dramatic natural elements, solitary cinematic human framing, or use 2D Doodle metaphors!
    single_entity_body_scene_rule: >
      Every scene MUST search ONLY '[Single Classical Sculpture / Nature Element / Solitary Figure] + [Lighting or Motion]' with ZERO 'vs' and ZERO abstract words ('stoicism', 'mindset', 'wisdom').
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Classical Statue or Nature Scene] + [Lighting/Action]' (e.g. 'marble statue shadow', 'waves crashing dark cliff') with ZERO 'vs'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 Shorts AND 16:9 HD clean classical architecture, sculpture, and dramatic landscape cinematography.
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      NEVER select quote-card videos with burned-in motivational captions or modern neon nightclub clips; combine clean classical/nature motion video with ~25% 2D Doodle Explainer scenes.
    clash_query_examples:
    - "ocean storm waves crashing rocky cliff"
    single_entity_query_examples:
    - "ancient roman marble statue shadow light"
    - "lone man standing mountain peak mist"
    - "hourglass sand falling macro dark"
    - "hand writing candlelight old parchment"
    stock_fallback_examples:
    - "marble statue dark light"
    - "ocean waves rocky cliff"
    - "man mountain sunrise mist"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#stoicedit"
    - "#sigmaedit"
    - "#capcut"
    - "#phonk"
    - "#veo"
    - "google veo"
    - "who would win"
    - "quotes"
    forbidden_ai_slop_markers:
    - "#ai"
    - "#aivideo"
    - "#aigenerated"
    - "#sora"
    - "#kling"
    - "ai generated"
  visual_archetypes_and_tool_routing:
  - archetype: "1. Classical Marble Statues & Dramatic Nature Cinematography"
    when_to_use: "Use for Scene 1-2 Opening Hook, emotional climax, and Final Scene."
    recommended_tool: "fetch_clean_cinematic_portrait_or_broll (media_preference='VIDEO_BROLL')"
    query_formula: "[Classical Statue / Solitary Figure / Storm Landscape] + [Chiaroscuro / Golden Light] (ZERO 'vs' or 'stoicism')"
  - archetype: "2. 2D Doodle Philosophical Paradox Metaphor"
    when_to_use: "Use on 1-2 middle scenes to illustrate internal control vs external chaos."
    recommended_tool: "render_doodle_2d_explainer_scene"
    query_formula: "character_tag (@ANCESTOR, @MODERNYOU) + prop_type (split, block, brain_battery, spear_nature)"
  strictly_forbidden_visuals:
  - "Motivational text quote cards, #stoicedit phonk captions, modern plastic offices, or AI Veo corner watermarks"
