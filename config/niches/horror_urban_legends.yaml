id: horror_urban_legends
name: Truyện Kinh Dị & Truyền Thuyết Đô Thị (Creepypasta)
badge: 👻 Kinh Dị & Kỳ Bí
icon: 👻
description: Những câu chuyện kinh dị có thật, truyền thuyết đô thị rùng rợn lúc 3h
  sáng, hiện tượng tâm linh kỳ quái và luật cấm kỵ dân gian.
target_audience: Khán giả thích cảm giác mạnh, hồi hộp sợ hãi, khám phá góc tối bí
  ẩn.
script_blueprint:
  tone_of_voice: Thì thầm, rợn gáy, giật gân, nghẹt thở, khiến người nghe lạnh sống
    lưng trong từng câu chữ.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'Midnight Rule: ''Nếu bạn thức giấc lúc 3 giờ 07 phút sáng và thấy cửa tủ mở he
    hé, TUYỆT ĐỐI KHÔNG được nhìn vào...'''
  - 'Cursed Object: ''Bức tranh này đã bị cấm bán đấu giá sau khi cả 4 người sở hữu
    nó đều...'''
  - 'The Uncanny Stranger: ''Người đàn ông đứng dưới chân cột đèn trước nhà bạn suốt
    3 đêm nay thực chất không phải...'''
  - 'Banned Emergency Call: ''Đoạn ghi âm cuộc gọi 911 bị giấu kín suốt 20 năm của
    một nhân viên trực đêm...'''
  narrative_structure: Hook quy tắc cấm kỵ rợn người -> Điềm báo quái dị leo thang
    -> Khoảnh khắc kinh hoàng bộc lộ -> Kết thúc mở rùng rợn -> CTA bảo vệ bản thân
    & Infinite Loop
  forbidden_words:
  - Xin chào các bạn đã quay trở lại kênh ma quái
  - Chúc các bạn ngủ ngon
  - Video này mang tính giải trí
  cta_templates:
  - "Nếu nghe thấy tiếng gõ cửa đúng 3 giờ 07 phút sáng, bạn sẽ (1) Nhìn qua lỗ mắt mèo hay (2) Khóa trái phòng nằm im? 👇"
  - " Theo bạn câu chuyện này là (1) Hiện tượng có thật chưa lời giải hay (2) Trùng hợp rợn người? 👇"
  anti_hallucination_rules:
  - Tạo dựng cốt truyện kịch tính nhưng không vi phạm chính sách nội dung gây hại
    hoặc kích động bạo lực của YouTube.
  banned_lexicon: &id001
  - comedy
  - cartoon
  - disneyland
  - cute puppy
  - romantic comedy
  - sunny beach
visual_aesthetics:
  art_style: Terrifying Eldritch Creature Horror, Analog VHS Found Footage & Dark Nightmare Cinema
  camera_angles: Creepy peep-hole view, shaky handheld night-vision camera catching monstrous silhouette, extreme low-angle terrifying creature towering in fog, flashlight beam freezing on glowing eyes in dark hallway
  color_palette: Sickly green night vision, blood crimson, abyssal pitch black, pale ghostly white, eerie cold moonlight
  master_prompt_prefix: terrifying horror movie still, spine-chilling creature silhouette with glowing eyes lurking in darkness, eerie found footage & dark concept art aesthetic, intense dread
  master_prompt_suffix: eerie volumetric fog, disturbing uncanny valley horror atmosphere, vertical 9:16 8k cinematography, hyper-detailed, no text, no watermark
  negative_prompts: sunny daylight, cheerful, colorful, smiling, cute cartoon, chibi, watermark, text
  stock_video_keywords:
  - terrifying monster shadow in dark hallway
  - creepy figure standing in fog night
  - old analog tv static horror
  - flashlight beam in pitch black forest
  - glowing eyes in darkness horror
subtitles:
  font_family: Creepster, Montserrat, Impact, sans-serif
  font_weight: '900'
  font_size: 56
  primary_color: '#FFF5F5'
  highlight_color: '#FF0033'
  accent_color: '#990000'
  outline_color: '#1A0000'
  outline_width: 4
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: -4Hz
  bgm_vibe: eerie dark horror ambient drone, jump-scare screech, disturbing metallic
    scraping
  sfx_cues:
  - creepy_whisper
  - door_slam
  - heartbeat_intense
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
llm_production_blueprint:
  niche_overview: >
    Creepypasta, 3AM Urban Legends, Cursed Artifacts & Analog Found-Footage Horror. Requires eerie dark hallways,
    night-vision anomalies, fog silhouettes, or 3D CGI cryptid scale footage without bright daylight or comedy memes.
  video_search_strategy:
    dual_track_clash_rule: >
      NEVER stuff 'A vs B' or 'vs' into horror video searches (which lures monster power-scaling #edit / phonk videos).
      Search ONLY single eerie atmospheric settings, night-vision sightings, or cryptid dark silhouettes!
    single_entity_body_scene_rule: >
      Every scene MUST search ONLY '[Single Eerie Subject or Dark Setting] + [Flashlight / Fog / Night-Vision Action]' with ZERO 'vs'.
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Dark Horror Setting] + [Lighting/Motion]' (e.g. 'dark hallway flashlight', 'foggy forest night') with ZERO 'vs'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 horror Shorts AND 16:9 HD dark atmospheric / analog night-vision footage without burned-in subtitles.
    allow_3d_cgi_video: true
    anti_flop_scene_continuity_rule: >
      Maintain dark nocturnal / low-key lighting continuity across all scenes; immediately reject bright sunny daylight clips or 2D kids cartoons.
    clash_query_examples:
    - "creepy silhouette standing dark hallway"
    single_entity_query_examples:
    - "flashlight beam dark abandoned corridor"
    - "shadowy figure standing foggy forest night"
    - "night vision camera eerie woods movement"
    - "old analog tv static dark room"
    stock_fallback_examples:
    - "dark hallway flashlight"
    - "creepy fog forest night"
    - "abandoned corridor shadow"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#vsedit"
    - "#capcut"
    - "#alightmotion"
    - "#phonk"
    - "#veo"
    - "#veo2"
    - "#veo3"
    - "google veo"
    - "who would win"
    - "who won"
    - "vs edit"
    - "power scaling"
    forbidden_ai_slop_markers:
    - "made with veo"
  visual_archetypes_and_tool_routing:
  - archetype: "1. Eerie Night-Vision, Dark Corridor & Cryptid Silhouette Footage"
    when_to_use: "Use across Scene 1 Hook, rising dread body scenes, and Final Scene."
    recommended_tool: "clone_youtube_short_peak_clip (or summon_epic_monster_cinematic_media for colossal cryptids)"
    query_formula: "[Dark Setting / Eerie Silhouette] + [Flashlight / Fog / Night Action] (ZERO 'vs')"
  strictly_forbidden_visuals:
  - "Bright sunny daylight beaches, cheerful cartoons, comparison #edit clips, or AI Veo corner watermarks"
