llm_production_blueprint:
  niche_overview: >
    Deep Sea, Thalassophobia & Extreme Earth Anomalies (Point Nemo, 2000m Sperm Whale vs Colossal Squid, Boiling River,
    Danakil Acid Crater, Leviathan CGI). Viewers demand real submersible footage, real deep-sea biological clashes, or
    colossal 3D CGI Megalophobia scale comparisons.
  video_search_strategy:
    dual_track_clash_rule: >
      For marine predator duels (e.g. Sperm Whale vs Colossal Squid, Orca vs Great White Shark), run DUAL-TRACK search in parallel on Hook/Climax:
      probe at most 1-2 real underwater encounter queries alongside 3+ clean SINGLE-SPECIES submersible/underwater queries. If 'A vs B' returns
      fan-edits or AI Veo clips, FAST-DROP 'A vs B' immediately and use clean single-species deep-sea footage!
    single_entity_body_scene_rule: >
      For body scenes explaining one marine creature's sonar/tentacles, depth pressure, or geological anomaly, NEVER inject 'A vs B' or 'vs'.
      Search ONLY '[Single Marine Creature or Earth Location] + [Underwater/Geological Action + Environment]'.
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Single Marine Species or Phenomenon] + [Ocean/Cave Environment]' with ZERO 'vs' / 'versus' and ZERO obscure literary adjectives.
    format_unlock_rule: >
      Search BOTH vertical 9:16 YouTube Shorts AND 16:9 HD/4K raw ROV submersible/expedition/oceanographic recordings; prioritize clean unedited expedition footage over edited #shorts.
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      Strictly separate real marine fauna (Sperm Whale, Giant Squid, Goblin Shark, Orca -> 100% real ocean/ROV camera footage, reject harmless filter-feeder whale sharks when topic is predatory sharks)
      from mythological/prehistoric leviathans (The Bloop, Kraken, Megalodon -> summon_epic_monster_cinematic_media 3D_CGI_VIDEO).
    clash_query_examples:
    - "orca attacking great white shark"
    - "sperm whale vs giant squid"
    - "moray eel attacking octopus"
    single_entity_query_examples:
    - "sperm whale diving deep ocean"
    - "giant squid underwater camera"
    - "goblin shark jaw underwater"
    - "danakil depression acid lake boiling"
    - "rov submersible deep sea darkness"
    stock_fallback_examples:
    - "sperm whale underwater"
    - "deep ocean submarine light"
    - "octopus underwater dark"
    - "volcanic crater boiling lava"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#vsedit"
    - "#vsedits"
    - "#capcut"
    - "#alightmotion"
    - "#phonk"
