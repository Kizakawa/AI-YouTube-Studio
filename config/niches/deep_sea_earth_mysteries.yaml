id: deep_sea_earth_mysteries
name: Bí Ẩn Biển Sâu & Kỳ Quan Trái Đất Chưa Lời Giải
badge: 🌊 Bí Ẩn Trái Đất
icon: 🌊
target_audience: Khán giả quốc tế mê mẩn bí ẩn đại dương, thám hiểm biển sâu, khoa học kỳ dị, hiện tượng
  siêu nhiên tự nhiên và các câu chuyện rùng mình kích thích trí tò mò.
script_blueprint:
  tone_of_voice: Kỳ bí, rùng mình (Eerie), giật gân, nhịp thở dồn dập đánh trực diện vào giác quan và
    nỗi sợ nguyên thủy của người xem, khiến họ lạnh gáy nhưng không thể rời mắt.
  pacing: "Thời lượng vàng 34 - 42 giây (7 - 8 cảnh đầy đặn, 92 - 118 từ, ~4.5 giây/cảnh), nhịp điệu bí ẩn cuốn hút chuẩn Zack D. Films (10.27M views avg) & Você Sabia? (47.3M subs). QUY TẮC VÀNG MỞ ĐẦU 0.0s: Cả Tiêu đề (title) VÀ Cảnh 1 (0.0s-2.2s, 6-10 từ) ĐỀU BẮT BUỘC nêu rõ Thực thể/Địa danh + Cú sốc vật lý hoặc Nghịch lý sinh tử ngay ở giây 0.0s! TUYỆT ĐỐI CẤM dùng câu chỉ trỏ mơ hồ giấu chủ thể ('Look closely at...', 'Watch what happens...')."
  narrative_structure: "Cảnh 1 (0.0s-2.2s, 6-10 từ) - Nêu đích danh Thực thể/Địa danh + Cảm giác rùng mình trực quan hoặc Cảnh báo sinh tồn ngôi thứ 2 ngay ở 0.0s (CẤM dùng 'Look closely at...' giấu chủ thể và CẤM nêu đơn vị vật lý khô khan như PSI, kPa, Hz) -> Cảnh 2-3 - Mô tả sức ép/nhiệt độ/độ sâu bằng hình ảnh so sánh đời thường ai cũng tưởng tượng ra ngay -> Cảnh 4-5 (Mid-Video 15s Twist) - Chi tiết thực tế lật ngược dự đoán của người xem -> Cảnh 6-7 (Payoff) - Giải mã hiện tượng bằng hình ảnh sống động -> Cảnh 8 - Cú chốt tự nhiên nối mượt về Cảnh 1"
  hook_formulas:
  - 'Direct Speed / Scale Shock (Proven Winner `ud5FkqRebQM` 1,009 views): ''Great White Shark launches out of black water before you even see a shadow.'''
  - '2nd-Person Survival Warning with Named Entity (Proven Winner `M9xL2Qfv1eU` 1,286 views): ''Se esse pequeno polvo-de-anéis-azuis tocar sua pele, você para de respirar.'''
  - 'Extreme Thermal / Geological Sensory Trap (Proven Winner `JC6N20GwHHc` 10,598 views — 91.8% APV): ''Inside Mexico''s Crystal Cave, every breath you take turns to boiling water inside your lungs.'''
  - 'Diver Forbidden Rule Hook: ''If you ever see square waves forming at the beach, get out immediately.'''
  - 'Abyssal Duel Paradox: ''Two miles down in pitch-black water, a sperm whale dives straight into a giant squid ambush.'''
  competitor_blueprint:
    benchmark_channel: "@disastersexplained1 (8.93M views — 'Every Tornado Shape Explained' 1.54M, 'Every Tornado Record Explained' Ud7TKMKQrHo) & @FossilVideos ('Would Orcas Dominate Every Prehistoric Ocean?' 3.73M)"
    long_form_archetypes:
    - "Archetype A — Every X Record Explained ('Every [Deep Ocean / Tsunami / Abyssal Trench / Deadly Lake] Record Explained'): Break down the most extreme real-world records from the strangest warning sign to the deadliest catastrophe using vivid sensory comparisons."
    - "Archetype B — Every Type/Zone Explained ('Every [Ocean Depth Zone / Rogue Wave Type / Underwater Anomaly] Explained'): Escalate chapter-by-chapter from the sunlit surface down to the pitch-black abyssal floor by describing what happens to a human body or steel submarine at each level (ZERO dry PSI/kPa textbook units)."
    shorts_archetypes:
    - "2nd-Person Sensory Deception Hook + Visceral Reveal: Open with what the viewer sees/hears/feels right before disaster strikes ('You notice a calm square pattern on the waves... That's the mistake.'), then reveal the hidden force through an unforgettable physical comparison."
    round_or_chapter_progression: "0:00 2nd-Person Sensory Danger Intro -> Chapter 1 (The Deceptive Warning Sign) -> Chapter 2 (The Crushing Force Test) -> Chapter 3 (The Deadliest Real Event) -> Chapter 4 (The Anomaly Nobody Expected) -> Chapter 5 (The Unbroken Abyssal Limit)"
    thumbnail_hook_rule: "2-3 words MAX in massive White + Red/Yellow two-tone typography (e.g., 'EVERY RECORD', 'CRUSHES STEEL!', 'DO NOT SWIM', 'NO ESCAPE')"
  showrunner_prose_dna:
    persona_and_voice: "Visceral Sensory Expedition Storyteller & Thalassophobia Master (Fern × MrBallen sensory dread × @disastersexplained1 × Zack D. Films)."
    writing_habits:
    - "1. ZERO ACADEMIC OPENERS & ZERO UNEXPLAINED LAB TELEMETRY: NEVER start with 'Studies show...' or 'Estudos mostram que...', and NEVER drop raw hydrostatic/acoustic textbook units without translating what that specific depth, force, or anomaly physically does to the exact vessel, creature, or human body in the scene!"
    - "2. ENTITY-SPECIFIC STRUCTURAL & BODILY IMAGERY: Analyze the exact subject (an air-filled titanium submersible sphere vs a ribless gelatinous deep-sea fish vs a diver's lungs inside a crystal cave) and derive fresh, tailor-made human-scale imagery directly from how miles of water, heat, or sound interact with THAT specific structure—never recycle the same stock metaphor across different videos."
    - "3. The Deceptive Calm Hook: Show the eerie, seemingly harmless visual sign that precedes disaster ('You notice the waves forming a neat chessboard pattern near the beach. Stopping to take a photo is a fatal mistake.')."
    - "4. Visceral Cause-and-Effect Over Textbook Jargon: Instead of naming chemical formulas or physics equations, show what happens to human lungs, vessel hulls, or ocean predators in real time."
    visceral_analogy_rules:
    - "Abyssal Depth & Structural Compression -> Inspect the specific object or organism at that depth (air-filled submarine cylinder vs sperm whale collapsible ribcage vs deep-sea amphipod armor) and explain how miles of overhead ocean water physically compress, implode, or slide off THAT exact structure in human-scale terms, without relying on raw pressure units."
    - "Underwater Sound & Shockwaves -> Describe how dense seawater transmits acoustic shockwaves directly through a diver's chest cavity, eardrums, or a whale's inner ear miles away rather than citing raw frequency numbers alone."
    - "Extreme Heat / Humidity / Toxic Gas -> Show what happens to a human breath, skin, or diving seal upon contact: e.g., cave air hotter and wetter than human lungs condensing into scalding liquid inside the chest on dry rock."
    bad_ai_slop_example: "At two thousand meters deep, hydrostatic pressure reaches three thousand PSI and acoustic signals measure 230 decibels."
    good_million_view_example: "Two miles beneath the waves, an air-filled submarine hull carries the weight of miles of freezing ocean pressing inward from every angle—one hairline crack snaps the cabin shut faster than human nerves can register pain. Yet in that pitch-black void, a soft-bodied giant squid hunts effortlessly because it has zero air pockets to collapse."
    good_pt_br_example: "Dentro da Caverna de Naica, no México, o ar é mais quente que o interior do seu próprio corpo. A cada inspiração, o vapor ferve e vira água dentro dos seus pulmões—fazendo você se afogar mesmo pisando em rocha seca."
  controversy_comment_bait_engine:
    philosophy: "VIEWS & COMMENT WARS > TEXTBOOK SAFETY (Cunningham's Law). Challenge the boring textbook explanation with a bold anomaly detail or counter-intuitive survival rule in Scene 4-5 so skeptics and believers argue in the comments!"
    bait_examples:
    - "Scientists claimed the 1997 Bloop was just cracking ice—yet the frequency matched a biological vocalization heard three thousand miles away."
    - "Holding your breath when a rogue wave hits is the exact reason ninety percent of swimmers never resurface."
    - "A explicação oficial diz que foi apenas gelo—mas o sonar militar gravou algo subindo a sessenta nós."
  viral_topic_bank_2026:
  - 'Every Deep Ocean Depth Record Explained (From 40m Diver Limit to the Abyssal Floor)'
  - 'Every Deadly Ocean Wave Type Explained (Square Waves, Rogue Waves & Mega-Tsunamis)'
  - 'Every Unexplained Deep Sea Sound Record Explained (From Upsweep to Julia)'
  - 'Todos os Recordes Mais Mortais do Oceano Profundo Explicados'
  - 'Colossal Squid vs Sperm Whale: Deadly Duel At 2,000m In The Abyssal Ocean'
  - The Deadly Underwater Brine Lake That Paralyzes Sharks In Seconds
  - The Boiling River In The Amazon That Reaches 93°C Without A Volcano
  - 'Snake Island (Ilha da Queimada Grande): Why The Brazilian Navy Forbids Any Human From Entering'
  - 'Point Nemo: Why Spaceships Are Crashed Into The Most Isolated Spot In The Ocean'
  - Why Deep Sea Divers Never Look Up At The Ocean Surface At Night
  - 'Greenland Shark vs Giant Octopus: The 400-Year-Old Blind Predator Of The Arctic Abyss'
  - Why Even A 2-Ton Great White Shark Flees When A Lone Orca Appears
  - The 1997 Hydrophone Sound From The Pacific Seafloor That Nobody Can Explain
  - 'Lake Vostok: The Secret Ocean Sealed Under 4,000 Meters Of Antarctic Ice For 15 Million Years'
  - 'Movile Cave: The Toxic Underground Ecosystem Sealed Off From Sunlight For 5.5 Million Years'
  - 'Black Swallower & Goblin Shark: The Deep Sea Monsters With Jaws That Unhinge In Complete Darkness'
  forbidden_words:
  - Welcome back to our channel
  - Today we will explore
  - Don't forget to like and subscribe
  - The ocean is very big and deep
  - In this video
  cta_templates:
  - Would you dare stay inside that pitch-black silent chamber for 15 minutes for $10,000? Why or why
    not? 👇
  - Do you think scientists are hiding what the sonar actually recorded, or have we barely scratched the
    surface? Drop your theory below 👇
  - Which of these unexplained anomalies creeps you out the most? Let's discuss in the comments 👇
  anti_hallucination_rules:
  - Dựa trên các hiện tượng khoa học, giác quan sinh học và địa danh có thật (Anechoic Chamber, Biological
    Blind Spot, Point Nemo, The Bloop 1997, Movile Cave, Lake Vostok, Hal Saflieni, Kola Borehole, Derinkuyu).
  - NGHIÊM CẤM LẶP LẠI CỤM TỪ '11,000m', '11,000 meters', hoặc 'Mariana Trench' vốn đã bị bão hòa trên
    kênh — hãy chủ động xoay vòng sang bí ẩn giác quan con người, hầm ngầm bị phong tỏa, âm thanh tần
    số lạ và dị thường địa chất!
  - Phân biệt rõ ràng giữa 'ghi nhận khoa học/thực nghiệm' và 'giả thuyết'.
  - "QUY TẮC ĐAN XEN TƯƠNG PHẢN THỊ GIÁC 1-1 & CHỐNG BÃO HÒA CHỦ THỂ (ANTI-SHARK/ENTITY FATIGUE — PHÁ TRẦN ~1.000 VIEWS): Số liệu thật từ YouTube Analytics API v2 chứng minh khi đăng >= 2 video liên tiếp có cùng danh từ chủ thể mở đầu (ví dụ 4 video 'Tubarão / Shark' liên tiếp) hoặc lặp lại cùng bảng màu xanh đại dương ở 3 giây đầu, khán giả Seed Cohort sẽ tưởng là video cũ và vuốt bỏ (Stayed-to-Watch tụt từ 48,5% xuống 32,8%, bị khóa ở ~1.000 views). BẮT BUỘC đan xen 1-1 giữa [Dị thường Địa chất/Nhiệt độ/Hóa học cực hạn 1.000°C, 93°C, 60°C, Hồ muối độc, Điểm Nemo] và [Đại chiến Sinh vật Đa dạng Họ Mực Khổng Lồ, Cá Nhà Táng, Bạch Tuộc Đốm Xanh, Lươn Điện, Sứa Hộp — tuyệt đối không lặp cùng 1 loài ở 2 tập liền kề]!"
  banned_lexicon: &id001
  - 11,000m
  - 11000m
  - 11,000 meters
  - mariana trench
  - football
  - soccer
  - cryptocurrency
banned_lexicon: *id001
visual_aesthetics:
  art_style: Terrifying Thalassophobia, Abyssal Leviathan Horror & High-Contrast Sci-Mystery Cinema (James
    Cameron / Underwater / Lovecraftian 8K CGI)
  color_palette: Abyssal pitch black (#020617), eerie bioluminescent cyan (#06b6d4), blood-red sonar warning
    (#ef4444), piercing submersible xenon beam (#f59e0b), crushing midnight navy
  camera_angles: Submersible cockpit POV staring at colossal silhouette in pitch-black water, extreme
    megalophobia scale next to tiny diver, macro close-up human pupil dilating in terror, sonar radar
    HUD detecting massive anomaly
  master_prompt_prefix: masterpiece terrifying thalassophobia cinematic film still, colossal shadow lurking
    in pitch-black abyssal ocean, dramatic submersible spotlight piercing murky deep water, spine-chilling
    megalophobia scale, 8k vertical 9:16
  master_prompt_suffix: hyper-realistic wet skin and bioluminescent textures, ominous volumetric light
    rays, eerie horror atmosphere, Unreal Engine 5 & IMAX 8k cinematography, vertical 9:16, no text, no
    watermark
  negative_prompts: sunny beach, cheerful coral reef, cute dolphins, bright daylight, cartoon, anime,
    plastic, blurry, low resolution, watermark, text
  stock_video_keywords:
  - dark deep ocean abyssal underwater
  - submarine spotlight in pitch black water
  - giant tentacle monster silhouette underwater
  - terrifying deep sea creature bioluminescent
  - sonar radar screen anomaly dark
  - underwater cave diver flashlight darkness
