description: Chuyên sâu 3 trụ cột có tỷ lệ giữ chân (Stayed%) và đơn giá quảng cáo
  (RPM) cao nhất thị trường Mỹ - (1) Tâm lý học Pháp y & Thẩm vấn Tội phạm FBI/Tòa
  án (Forensic & Courtroom Psychology), (2) Thí nghiệm Não bộ & Cơ thể Cực đoan (Extreme
  Brain & Sensory Experiments), (3) Giải mã Bẫy Tâm lý Tài chính, Casino & Tỷ phú
  (Financial & Power Mind Traps).
target_audience: Khán giả Mỹ & Quốc tế (18-45 tuổi) đam mê giải mã hành vi tội phạm
  tại tòa án/phòng thẩm vấn, khám phá giới hạn sinh học của não bộ con người trong
  điều kiện cực đoan và vạch trần các bẫy thao túng tiền bạc.
script_blueprint:
  tone_of_voice: Trầm tĩnh, sắc lạnh như hồ sơ pháp y FBI & giải phẫu thần kinh học,
    trực diện không một từ thừa (Surgical forensic profiler & neuro-scientist — Grade-5
    US spoken clarity, Zack D. Films / JCS Criminal Psychology vibe).
  pacing: "Thời lượng vàng 34 - 42 giây (7 - 8 phân cảnh đầy đặn, 92 - 118 từ, ~4.5 giây/cảnh để đạt APV > 95% và qua bài kiểm tra Cohort ngày 2). QUY TẮC VÀNG MỞ ĐẦU 0.0s: Cả Tiêu đề (title) VÀ Cảnh 1 (0.0s-2.2s, 6-10 từ) ĐỀU BẮT BUỘC nêu rõ chủ thể/bẫy tâm lý/thẩm vấn FBI + Cú sốc hành vi hoặc câu thoại ngoài đời thực ngay ở 0.0s! TUYỆT ĐỐI CẤM dùng câu chỉ trỏ mơ hồ giấu chủ thể ('Look closely at why you cannot find the exit', 'Watch this...')!"
  hook_formulas:
  - 'Real-Life Spoken Insult / Manipulation Trap (Charisma on Command 9.78M Formula): ''"You actually look good today" is a hidden insult—here is why.'''
  - 'Named FBI Interrogation Trap: ''FBI interrogators place one water cup six inches from guilty suspects.'''
  - 'Courtroom / Body Language Glitch (#1 Channel Winner `IuVZBifW04w`): ''If a suspect touches their neck while apologizing, they are lying.'''
  - 'Extreme Brain / Sensory Deprivation Warning: ''Inside a minus-nine-decibel silent chamber, human brains hallucinate within minutes.'''
  - 'Named Casino & Billionaire Mind Trap: ''Las Vegas casinos remove every clock to spike your brain''s dopamine.'''
  - '@IFinity_What 2nd-Person Brain Paradox Escalation (493K & 89.9K Formula): ''At first, never needing sleep feels like a superpower—until Hour 72 rewires your brain.'''
  competitor_blueprint:
    benchmark_channel: "JCS - Criminal Psychology (50M+ views) × Charisma on Command (9.78M) × Chase Hughes (CIA Profiler, 8.6M) × @IFinity_What (734K in 12 days)"
    long_form_archetypes:
    - "Archetype A — 'What If YOU...' 2nd-Person Neurological/Psychological Escalation ('What If You Could Read Every Mind in the Room?', 'What If You Never Felt Fear Again?', 'What If You Stayed 72 Hours in the -9.4 dB Silent Chamber?'): Escalate from Minute 1 (The Honeymoon Superpower) -> Hour 12 (The Hidden Neural Glitch) -> Day 3 (Sensory Overload & Cortisol Collapse) -> Day 7 (Complete Psychological Breakdown)."
    - "Archetype B — Forensic CIA/FBI Interrogation & Covert Manipulation Breakdown (JCS / Chase Hughes / Charisma on Command): Break down 10 escalating forensic or covert manipulation protocols (CIA Elicitation, 4-Second Silence Audit, Double-Bind Escape) with verbatim dialogue reconstruction and `@MODERNYOU` 2D Doodle Explainer scenes."
    shorts_archetypes:
    - "2nd-Person Experiential Brain/Forensic Glitch ('If you stop blinking during an interrogation, the detective already knows your secret.'): Direct 'YOU' framing + concrete neurological/FBI mechanism + `@MODERNYOU` 2D Doodle visual continuity."
    round_or_chapter_progression: "0:00 Minute 1: The Superpower Illusion -> Chapter 1 (Hour 1: The First Neural Shift) -> Chapter 2 (Hour 24: The Hidden Brain Trap) -> Chapter 3 (Day 3: Sensory & Dopamine Overload) -> Chapter 4 (Day 7: Complete Breakdown) -> Chapter 5 (The Neurological Truth)"
    thumbnail_hook_rule: "2-3 words MAX in massive White + Red/Yellow two-tone typography (e.g., 'TURN INVISIBLE.', 'KNOW EVERYTHING?', '45 MINUTES MAX', '4-SECOND SILENCE')"
  showrunner_prose_dna:
    persona_and_voice: "Cold, surgical, unapologetically blunt CIA/FBI Behavioral Profiler & Dark Social Dynamics Realist (JCS Criminal Psychology × Chase Hughes × Charisma on Command)."
    writing_habits:
    - "1. ZERO ACADEMIC STUDY OPENERS & ZERO CLINICAL JARGON: NEVER start any sentence with 'Studies show...', 'Psychological studies reveal...', 'Research indicates...', or 'Scientists found...', and NEVER use stiff university jargon like 'submissive compliance' or 'interpersonal hierarchies'. Jump straight into visceral human behavior ('The exact second you apologize first, their brain marks you as easy prey.')."
    - "2. Open With a Micro-Expression or Verbatim Spoken Trap ('Show, Don't Tell'): Never lecture abstractly about manipulation. Quote the exact words a manipulator drops in real life (e.g., '\"You are way too sensitive\" is not an opinion—it is a calculated bait trap.') or point to an involuntary physical reflex ('Watch a suspect's blink rate the exact second you stop nodding.')."
    - "3. Name the Concrete Forensic / Neural Mechanism: Cite specific profiling concepts or famous named experiments (1971 Stanford Prison, CIA Elicitation, The 4-Second Silence Audit, 0.2-Second Amygdala Hijack, Intermittent Dopamine Trap) with visceral clarity."
    - "4. MANDATORY WORD-FOR-WORD VERBAL COUNTER-MOVE IN QUOTES (SCENE 6): Never give vague advice like 'set a visible boundary' or 'be confident'. In Scene 6 (Act 4), you MUST give the viewer an exact, cold 1-sentence spoken counter-line inside quotation marks to say out loud (e.g., 'Next time they test your boundary, hold eye contact for three seconds and ask: \"Are you asking me, or telling me?\"')."
    bad_ai_slop_example: "Psychological boundary studies reveal that when submissive compliance exceeds eighty percent, manipulators lose respect. To be respected, you must set a visible boundary."
    good_million_view_example: "The exact second you apologize for something you didn't do, a manipulator's brain marks you as easy prey. Next time they push your limit, hold eye contact for four seconds and ask: 'What did you hope I would feel when you said that?'"
  controversy_comment_bait_engine:
    philosophy: "VIEWS & COMMENT WARS > POLITE TEXTBOOK SAFETY (Cunningham's Law). Safe, polite advice gets 0 comments. Intentionally plant 1 bold, polarizing 'Sacred-Cow Breaker' in Scene 1 or Scene 4-5 that attacks a common polite habit as a weakness/scam so viewers rush into the comments to argue while the video loops in the background!"
    bait_examples:
    - "Apologizing first doesn't make people forgive you—it makes them respect you eighty percent less."
    - "Being 'the bigger person' is the biggest scam ever invented to keep polite people obedient."
    - "Nice people are actually the easiest targets in any room, and manipulators spot them in three seconds."
