id: psychology
name: Tâm Lý Học Pháp Y, Thí Nghiệm Não Bộ & Giải Mã Bẫy Tiền Bạc (Forensic, Brain
  Science & Money Psychology)
badge: 🧠 Tâm Lý & Não Bộ
icon: 🧠
description: Chuyên sâu 3 trụ cột có tỷ lệ giữ chân (Stayed%) và đơn giá quảng cáo
  (RPM) cao nhất thị trường Mỹ - (1) Tâm lý học Pháp y & Thẩm vấn Tội phạm FBI/Tòa
  án (Forensic & Courtroom Psychology), (2) Thí nghiệm Não bộ & Cơ thể Cực đoan (Extreme
  Brain & Sensory Experiments), (3) Giải mã Bẫy Tâm lý Tài chính, Casino & Tỷ phú
  (Financial & Power Mind Traps).
target_audience: Khán giả Mỹ & Quốc tế (18-45 tuổi) đam mê giải mã hành vi tội phạm
  tại tòa án/phòng thẩm vấn, khám phá giới hạn sinh học của não bộ con người trong
  điều kiện cực đoan và vạch trần các bẫy thao túng tiền bạc.
script_blueprint:
  tone_of_voice: Trầm tĩnh, sắc lạnh như hồ sơ pháp y FBI & giải phẫu thần kinh học,
    trực diện không một từ thừa (Surgical forensic profiler & neuro-scientist — Grade-5
    US spoken clarity, Zack D. Films / JCS Criminal Psychology vibe).
  pacing: Thời lượng vàng 28 - 35 giây (6 - 7 phân cảnh súc tích, 75 - 92 từ, 4.0
    - 4.8 giây/cảnh để đẩy APV > 90%). CẤM dùng câu 1 từ rời rạc và CẤM làm chủ đề
    tình cảm/nhắn tin/bạn bè chung chung. Cảnh 1 (0-2.0s) PHẢI là câu 5-8 từ trực
    diện nêu thẳng vụ án/thí nghiệm não bộ/bẫy tiền bạc kèm con số vật lý cụ thể.
    Cảnh 2-3 mô tả hiện trường phòng thẩm vấn/phòng thí nghiệm/sòng bạc, Cảnh 4 (giây
    14-18) là Mid-Video Twist giải phẫu cơ chế thần kinh học (amygdala, dopamine,
    vagus nerve, cognitive load), Cảnh 5-6 đưa ra bằng chứng thực nghiệm hoặc phép
    thử tự kiểm chứng, Cảnh 7 là Cầu nối Vòng lặp Vô tận (Infinite Loop Bridge) nối
    mượt về Cảnh 1.
  hook_formulas:
  - Forensic Courtroom / Interrogation Glitch (#1 Proven Channel Winner - 39.1% Stayed)
    - 'Guilty suspects always fail this two-second water cup test!'
  - Extreme Brain / Sensory Deprivation Experiment (#1 US Macro Niche - 4M Avg Views)
    - 'Forty-five minutes in this silent room makes your brain hallucinate!'
  - Polygraph & FBI Behavioral Trap - 'FBI interrogators watch your feet, never your
    eyes, when you lie!'
  - Casino & Billionaire Money Trap (High-RPM Finance Psychology) - 'Casinos banned
    windows and clocks to hijack your dopamine!'
  - Criminal Profiling Paradox - 'Why serial killers smile the exact second the judge
    reads the verdict!'
  viral_topic_bank_2026:
  - 'The Interrogation Water Cup Test: Why FBI Agents Place a Cup 6 Inches From a
    Suspect'
  - 'Inside the -9.4 Decibel Chamber: Why No Human Brain Can Survive 45 Minutes of
    Total Silence'
  - Why Guilty Suspects Repeat Your Exact Question Before Answering in Police Interrogations
  - 'White Room Torture: What 72 Hours of Complete Color Deprivation Does to the Human
    Brain'
  - How Las Vegas Casinos Use Oxygen, Carpet Patterns, and Zero Clocks to Hijack Your
    Brain
  - 'The 1971 Stanford Prison Collapse: How 24 Normal Students Turned Ruthless in
    Just 6 Days'
  - Why Trained Liars Control Their Face But Always Betray Themselves With Their Feet
    (FBI Profiling)
  - 'The Decoy Pricing Trap: How Movie Theaters and Tech Giants Trick Your Brain Into
    Buying the Expensive Option'
  - Why Suspects Stare Straight Unblinking After Telling a Lie (The Cognitive Load
    Stare)
  - 'The Monster Study of 1939: The Forbidden Speech Experiment That Broke Orphans
    in 4 Months'
  - Why Billionaires and Surgeons Wear the Exact Same Outfit Every Day (Decision Fatigue
    Science)
  - How Hostage Negotiators Use the 8-Second Late-Night FM DJ Voice to Disarm Armed
    Suspects
  - 'The Milgram Shock Machine: Why 65% of Ordinary People Obeyed Orders to Deliver
    450 Volts'
  - Why Your Brain Slows Down Time During a Car Crash (The Amygdala High-Speed Frame
    Illusion)
  - How Polygraph Examiners Catch You Before They Even Ask the Real Question (The
    Control Lie Trap)
  - 'The Sunk Cost Trap: How Auctions Force Smart Investors to Pay Double in 60 Seconds'
  narrative_structure: 'Beat 1: Cú sốc Pháp y / Thí nghiệm Não bộ / Bẫy Tiền bạc 5-8
    từ có con số (0-2s) -> Beat 2: Hiện trường phòng thẩm vấn / phòng thí nghiệm /
    sòng bạc thực tế (2-12s) -> Beat 3: Mid-Video Twist giải phẫu cơ chế thần kinh
    học & hồ sơ FBI ở giây 14 (12-22s) -> Beat 4: Phép thử thực tế & Cầu nối Vòng
    lặp Vô tận ở Cảnh cuối (22-33s)'
  forbidden_words:
  - Chào mừng các bạn đã quay trở lại
  - Bạn có bao giờ tự hỏi
  - Trong video hôm nay tôi sẽ chia sẻ
  - Hãy like và subscribe kênh của mình nhé
  - Theo định nghĩa tâm lý học
  - Welcome back to our channel
  - In today's video
  - Did you know that
  - 3 signs someone has a crush on you
  - double text
  - narcissist blocked
  - toxic ex
  cta_templates:
  - 'Quick Poll: Would you last (1) 45 minutes in the silent room or (2) tap out in
    10 minutes? Vote 1 or 2 below! 👇'
  - 'Quick Poll: Do you think polygraph tests are (1) 90% accurate or (2) easy to
    beat? Drop 1 or 2 below! 👇'
  - 'Quick Poll: When someone lies to you, do you watch (1) their eyes or (2) their
    hands/feet? Vote 1 or 2 below! 👇'
  anti_hallucination_rules:
  - Bắt buộc neo vào các thí nghiệm thần kinh học, kỹ thuật thẩm vấn FBI/tòa án hoặc
    nguyên lý kinh tế học hành vi có thật (Orfield Anechoic Chamber -9.4 dBA, FBI
    Joe Navarro Limbic Freeze / Foot Pointing, Reid Technique Water Cup Test, Stanford
    Prison 1971, Milgram 450V Experiment, Dan Ariely Decoy Effect, Gruen Transfer
    Casino Design, Cognitive Load Theory).
  - Tuyệt đối KHÔNG viết các bài listicle tình cảm chung chung (3 signs someone likes
    you, narcissist texting, fake friends).
  banned_lexicon:
  - astrology horoscope
  - magic crystal
  - alien invasion
  - deep sea creature
  - football
  - soccer
