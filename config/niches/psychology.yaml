id: psychology
name: Tâm Lý Học Đen Tối & Giải Mã Thao Túng (Mastering Mind Control Style)
badge: 🧠 Tâm Lý Học
icon: 🧠
description: Chuyên sâu về tâm lý học hành vi, giải mã đòn thao túng ngầm (The Isolation Gambit,
  Reverse Gaslighting, Intermittent Reinforcement, Pavlovian Triggers, Ben Franklin Effect),
  đọc vị vi biểu cảm và phản đòn tâm lý thực chiến chuẩn phong cách @MasteringMindControl.
target_audience: Khán giả 18-35 tuổi muốn nhận diện thao túng ngầm, tự vệ tâm lý, đọc vị đối phương
  và làm chủ quyền lực tĩnh lặng trong các mối quan hệ xã hội.
script_blueprint:
  tone_of_voice: Trầm tĩnh, sắc lạnh như dao mổ, uy quyền, trực diện không một từ thừa
    (Calm, surgical, authoritative, dark noir psychological insight — @MasteringMindControl signature).
  pacing: Thời lượng cô đọng 22 - 28 giây (7 - 9 phân cảnh chớp nhoáng, 60 - 80 từ, 2.0 - 2.6 giây/cảnh).
    Câu ngắn nhịp Staccato ("A word. A face. A sound. You don't think—you just react.").
    Cảnh 1 là Trích dẫn Thao túng / Phản xạ Vô thức (1.8s), Cảnh 2-4 giải phẫu cơ chế 3 bước ("First... Then... Eventually..."),
    Cảnh 5-6 định danh Hiệu ứng Tâm lý & Mệnh đề Đối lập ("Love expands your world. Control shrinks it."),
    Cảnh 7-8 là Đòn Phản Công Thực Chiến (Verbal Counter-Move / Mental Drill) nối vòng lặp vô tận về Cảnh 1.
  hook_formulas:
  - 'The Covert Quote Dissection (@MasteringMindControl #1 Formula): ''"Your friends don''t understand you. You only need me." Sounds caring—until your circle disappears.'''
  - 'Subconscious Trigger / Invisible Leash: ''A word. A face. A sound. Your heart races before you even think. That is the invisible leash.'''
  - 'Named Psychological Gambit / Effect: ''Do a favor for an enemy, and your brain tricks you into liking them. It is called the Ben Franklin Effect.'''
  - 'Guilt & Boundary Trap: ''If you feel guilty for saying no, you are already inside their manipulation trap.'''
  - 'Instant Verbal Counter-Move: ''When a manipulator twists your words, never defend yourself. Say these 6 calm words instead...'''
  viral_topic_bank_2026:
  - "The Isolation Gambit: How Control Slowly Shrinks Your World"
  - "Reverse Gaslighting: How to Reclaim Your Reality Without Arguing"
  - "The Ben Franklin Effect: How One Small Favor Turns Enemies Into Allies"
  - "The Invisible Leash: How Pavlovian Triggers Control Your Mind Before You Think"
  - "The False Choice Trap: How Strategic Ultimatums Steal Your Freedom"
  - "Why Manipulators Use Intermittent Reinforcement to Keep You Addicted"
  - "The Psychology of Emotional Mirroring: Why Familiarity Is the Best Disguise"
  - "Why the Silent Treatment Creates Panic — And How to Break Its Power"
  - "The Psychology of Suggestive Gaslighting: Repeated Doubt Reshapes Certainty"
  - "How Covert Narcissists Weaponize Vulnerability to Bypass Your Boundaries"
  narrative_structure: "Beat 1: Trích dẫn thao túng / Kích hoạt vô thức (0-3s) -> Beat 2: Giải phẫu chuỗi 3 bước 'First... Then... Eventually...' (3-11s) -> Beat 3: Định danh Hiệu ứng Tâm lý & Mệnh đề Đối lập đắt giá (11-18s) -> Beat 4: Đòn Phản Công Thực Chiến (Verbal Counter-Move) & Cầu nối Vòng lặp Vô tận (18-26s)"
  forbidden_words:
  - Chào mừng các bạn đã quay trở lại
  - Bạn có bao giờ tự hỏi
  - Trong video hôm nay tôi sẽ chia sẻ
  - Hãy like và subscribe kênh của mình nhé
  - Theo định nghĩa tâm lý học
  - Welcome back to our channel
  - In today's video
  - Did you know that
  cta_templates:
  - "Have you ever caught someone using the Isolation Gambit or Sign #2 on you? How did you respond? 👇"
  - "Which of these covert manipulation tactics is the hardest to spot before it's too late? Drop your thoughts below 👇"
  - "Have you ever felt the 'Invisible Leash' trigger in a relationship? Share your experience below 👇"
  anti_hallucination_rules:
  - Luôn gắn liền với hiệu ứng/cơ chế tâm lý học có thật (The Isolation Gambit, Ben Franklin Effect,
    Classical Conditioning / Pavlovian Triggers, Intermittent Reinforcement, Cognitive Dissonance,
    Suggestive Gaslighting, Emotional Mirroring, Pratfall Effect, Double Bind / False Choice Trap).
  - Mỗi kịch bản phải cung cấp ít nhất 1 mệnh đề đối lập sắc bén (ví dụ "Love expands your world — control shrinks it")
    và 1 đòn tự vệ/ứng dụng thực tế (Drill / Counter-phrase).
  banned_lexicon: &id001
  - astrology horoscope
  - magic crystal
  - alien invasion
  - deep sea creature
  - football
  - soccer
visual_aesthetics:
  art_style: Dark Psychological Noir & Monochrome Seinen Thriller Aesthetic (@MasteringMindControl / Monster / Chiaroscuro Noir Style)
  camera_angles: Extreme close-up psychological gaze, half-face shadow framing, tense two-person profile confrontation in silence, low-angle cold authority portrait, silhouette in doorway shadow
  color_palette: Monochrome charcoal and silver-white chiaroscuro noir, deep obsidian shadows, stark ivory highlights, floating atmospheric film dust particles
  master_prompt_prefix: masterpiece dark psychological thriller art, monochrome noir aesthetic, high-contrast chiaroscuro lighting, intense micro-expression, seinen psychological anime & cinematic noir film still, floating dust particles
  master_prompt_suffix: stark silver and charcoal contrast, razor-sharp eyes and facial expression, moody atmospheric depth, vertical 9:16 composition, no text, no watermark
  negative_prompts: bright cheerful corporate office, smiling stock photo business people, colorful cartoon, chibi, blurry, low quality, distorted faces, extra fingers, watermark, text
  stock_video_keywords:
  - chess grandmaster hand moving piece dark
  - two people tense silence confrontation shadow
  - man cold expression shadow portrait
  - silhouette walking dark corridor
  - broken mirror reflection face dark
  - pocket watch swinging hypnotic dark
  - rain window silhouette thinking night
