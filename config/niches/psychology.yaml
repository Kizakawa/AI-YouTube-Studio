llm_production_blueprint:
  niche_overview: >
    Million-view Forensic, Brain Science & Dark Psychology YouTube Shorts (1.8M-39M views benchmark: Zack D. Films,
    JCS Criminal Psychology, Charisma on Command) NEVER use generic corporate/casual Pexels stock clips of people in
    t-shirts or bright offices. Every scene must be routed by the LLM to one of 4 high-retention visual production tools
    based on whether the scene is concrete forensic/character action, 3D brain anatomy, or an abstract psychological trap.
  video_search_strategy:
    dual_track_clash_rule: >
      NEVER stuff 'A vs B' or 'vs' into psychology/forensic video searches (which triggers sigma #edit / phonk fan-edits with heavy flashing text).
      Search ONLY concrete single-focus forensic interrogation, courtroom reaction, 3D glowing brain anatomy, or dark noir micro-expression footage!
    single_entity_body_scene_rule: >
      Translate every psychological/behavioral concept via abstract_to_physical_query_translations into '[Concrete Subject/Setting] + [Observable Micro-Expression or Neural Process]'
      (3-5 words, ZERO abstract nouns like 'narcissist', 'gaslighting', 'cognitive dissonance', and ZERO 'vs').
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Dark Noir Human Subject or Lab Room] + [Physical Action]' (e.g. 'suspect sweating interrogation', 'dark shadow eye contact') with ZERO 'vs'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 Shorts AND 16:9 HD clean courtroom/interrogation archival footage & 3D neuroscience visualizations without burned-in captions.
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      NEVER output static academic infographic queries, book covers, or quote cards ('tactical infographic overlay', 'neural mapping chart'),
      and NEVER use search_google_cinematic_image for psychology scenes — route strictly to real human micro-expression video, 3D glowing brain animation, or render_doodle_2d_explainer_scene!
    clash_query_examples:
    - "fbi detective interrogating nervous suspect"
    single_entity_query_examples:
    - "fbi interrogation suspect sweating"
    - "courtroom defendant nervous eye blink"
    - "3d glowing brain neurons firing"
    - "polygraph needle trembling paper"
    - "quietest room anechoic chamber inside"
    stock_fallback_examples:
