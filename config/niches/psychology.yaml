id: psychology
name: Tâm Lý Học Pháp Y, Thí Nghiệm Não Bộ & Giải Mã Bẫy Tiền Bạc (Forensic, Brain
  Science & Money Psychology)
badge: 🧠 Tâm Lý & Não Bộ
