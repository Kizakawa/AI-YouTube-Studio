  - double text
  - texting your ex
visual_aesthetics:
  art_style: Forensic Interrogation Noir & High-Contrast Neuro-Science Documentary
    Aesthetic (JCS Criminal Psychology / Zack D. Films / Fincher Noir)
  camera_angles: Police interrogation table two-shot, extreme close-up courtroom witness
    eyes, glowing 3D brain MRI neural pathway scan, polygraph needle trembling on
    paper, high-angle isolated white chamber, dark casino roulette table close-up
  color_palette: Cold forensic steel-blue and obsidian noir shadows, stark clinical
    white highlights, crimson alert accents
  master_prompt_prefix: 8k vertical forensic documentary film still, Fincher style
    cold clinical lighting, high-contrast noir shadows, ultra-detailed realistic human
    expression and anatomical precision
  master_prompt_suffix: razor-sharp focus, dramatic courtroom or laboratory atmosphere,
    vertical 9:16 composition, no text, no watermark
  negative_prompts: bright cheerful corporate office, smiling stock photo couple,
    romantic dating scene, colorful cartoon, chibi, blurry, low quality, distorted
    faces, extra fingers, watermark, text
  stock_video_keywords:
  - police interrogation room detective suspect
  - courtroom judge gavel trial witness
  - human brain mri scan neurons glowing
  - lie detector polygraph test needle
  - soundproof room isolation experiment lab
  - casino roulette chips las vegas money
  - fbi agent investigating crime board
