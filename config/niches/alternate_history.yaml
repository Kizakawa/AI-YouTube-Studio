id: alternate_history
name: Lịch Sử Giả Định & "What If?" (Alternate History & Paradoxes)
badge: ⏳ Alternate History & What If?
icon: ⏳
description: Khám phá các dòng thời gian song song, những bước ngoặt lịch sử chấn động (What If?), các siêu thảm họa kỹ thuật/tự nhiên có thật và thế giới sẽ ra sao nếu lịch sử rẽ sang hướng khác.
target_audience: Khán giả Mỹ và toàn cầu đam mê lịch sử kịch tính, thảm họa lịch sử có thật, siêu dự án quân sự và câu hỏi giả định (18-45 tuổi).
script_blueprint:
  tone_of_voice: "Kịch tính, nhịp độ dồn dập, ngôn ngữ Tiếng Anh giao tiếp lớp 5 sắc gọn (HistoryMarche 5.33M / Zack D. Films 51.4M / Historically vibe), nhảy thẳng vào giữa tâm chấn trận đánh hoặc khoảnh khắc sai lầm lịch sử (In Medias Res) ngay ở giây 0.0s."
  pacing: "Thời lượng vàng 34 - 42 giây (7 - 8 cảnh trọn câu, 92 - 118 từ tổng, ~4.5 giây/cảnh). QUY TẮC VÀNG MỞ ĐẦU 0.0s: Cả Tiêu đề (title) VÀ Cảnh 1 (0.0s-2.2s, 6-10 từ) ĐỀU BẮT BUỘC nêu rõ Đế chế/Danh tướng/Thảm họa + Cú sốc vật lý hoặc Nghịch lý lịch sử ngay ở giây 0.0s! TUYỆT ĐỐI CẤM dùng câu chỉ trỏ mơ hồ giấu tên chủ thể ('Look closely at...', 'People woke up to...')!"
  hook_formulas:
  - 'Direct Historical Shock Event (Proven Winner `PVoVipDbLt8` 1,115 views — 87.5% APV): ''One hundred thousand Mongol horsemen vanished forty miles from Vienna.'''
  - 'Catastrophe vs. Shield Paradox (Proven Winner `D_sIws9Buto` 1,349 views — 123.8% APV): ''Earth survived only because the Krakatoa volcano killed thousands.'''
  - 'Split-Second Doomsday Mistake: ''One low-voltage switch saved North Carolina from two four-megaton nuclear bombs.'''
  - 'Named Megaproject / Eruption Shock: ''In 1815, Mount Tambora''s eruption buried June under freezing snowstorms.'''
  - 'Counterfactual Catastrophe Shield: ''Europe survived in 1986 only because three Chernobyl divers swam into radioactive water.'''
  - '@IFinity_What 2nd-Person Experiential Timeline Hook (493K in 10 Days Formula): ''If you woke up in 1815 when Mount Tambora erupted, the summer snow turns red.'''
  competitor_blueprint:
    benchmark_channel: "@IFinity_What (734K views in 12 days — 'What If You Could Turn Invisible at Will?' 493K, 'What If You Knew Everything in the World?' 89.9K) & @FossilVideos ('How Long You'd Last in Every Prehistoric Era' 12.08M)"
    long_form_archetypes:
    - "Archetype A — 'What If YOU...' 2nd-Person Timeline Escalation ('What If You Lived Through Every [Historical Catastrophe / Megaproject Failure]?', 'What If You Controlled [Historical Superweapon]?'): Escalate chronologically from Minute 1 (The Illusion of Control) -> Hour 24 (The First Systemic Shock) -> Day 7 (Chain-Reaction Collapse) -> Year 1 (The Rewritten World)."
    - "Archetype B — 'How Long You'd Last in Every [Historical Era / Siege / Disaster]': Put the viewer ('YOU') inside 5 escalating historical eras/disasters with exact survival odds, temperature/megaton metrics, and fatal traps."
    shorts_archetypes:
    - "2nd-Person Historical Survival Simulation ('If you stood 10 miles from Lituya Bay in 1958, looking at the mountains was your last mistake.'): Combine immediate 2nd-person danger with verified historical physics."
    round_or_chapter_progression: "0:00 Minute 1: The Deceptive Calm -> Chapter 1 (Hour 1: The Trigger Event) -> Chapter 2 (Hour 24: The Hidden Trap Activates) -> Chapter 3 (Day 7: The Domino Collapse) -> Chapter 4 (Month 1: The Point of No Return) -> Chapter 5 (The Final Aftermath)"
    thumbnail_hook_rule: "2-3 words MAX in massive White + Yellow/Red two-tone typography (e.g., 'ZERO SURVIVORS', '1,720 FT WAVE', 'DO NOT LOOK')"
  showrunner_prose_dna:
    persona_and_voice: "Punchy, suspenseful, conversational Historical & What-If Storyteller (Zack D. Films 4.6M vivid physical storytelling × IFinity What 'In one blink, everything changes' × RealLifeLore). Drops you straight inside the split-second crisis with natural spoken contractions—NEVER reads like a dry Wikipedia date summary!"
    writing_habits:
    - "1. PUNCHY ACTIVE HOOK + URGENT SPOKEN PRESENT TENSE (Zack D. Films 4.4M × IFinity What Formula): Open Scene 1 (8–12 punchy words) with a high-voltage active action naming the Historical Person or Event right at word 1 ('Two live hydrogen bombs fall out of a broken US bomber—and don't explode.', 'Stanislav Petrov has five minutes to stop World War Three—and refuses to flinch.'). Then tell Scenes 2–4 in URGENT SPOKEN PRESENT TENSE ('Inside the room, alarms are screaming that...', 'They've armed the weapon, and it takes all three keys to fire.')! Present-tense storytelling automatically creates natural spoken contractions ('it's', 'he's', 'they've', 'doesn't', 'aren't') and kills stiff Wikipedia past-tense date-stamp summaries ('In 1961...', 'sat one key turn away', 'Under fleet rules, launching required...')."
    - "2. 'YOU'D THINK...' CONVERSATIONAL PIVOT & CONSISTENT 'WOULD'VE' WHAT-IF CHAIN REACTION: Use natural spoken pivots ('Two switches have already flipped on. You'd think detonation is guaranteed—except one thin wire snaps right in time.') and weave 6+ spoken contractions throughout ('it's', 'they've', 'doesn't', 'you'd', 'hadn't', 'would've', 'they'd'). STRICTLY BAN stiff textbook phrases ('Under ... rules', 'launching that weapon required', 'senior officer', 'unleashing a nuclear war', 'nuclear exchange', 'atomic retaliation', 'kiloton', 'megaton'). When playing out 'What If X happened' in Scene 5–6, use crisp 'would've' contractions ('If he'd turned that key, the blast would've wiped out the entire fleet overhead—and set off missiles on both sides within minutes.')!"
    - "3. RAZOR-SHARP IRONIC MIC-DROP ENDING: End on a punchy human irony with contractions ('One calm no in a sweltering room stopped World War Three—and nobody on the surface even knew how close they'd come.')!"
    visceral_analogy_rules:
    - "Explosions, Disasters & Split-Second Decisions -> Put the viewer physically inside the room in the present tense using everyday spoken imagery (parachutes snagging trees, depth charges rattling steel walls overhead, keys turning in locks) instead of dry military report summaries."
    bad_ai_slop_example: "In January 1961, an officer sat one switch away from unleashing a war. Under Air Force rules, launching that weapon required every senior officer to agree."
    good_million_view_example: "Two live hydrogen bombs fall straight out of a broken US bomber over North Carolina—and don't explode. One parachute snags a tree on impact, and five of the six firing switches flip on by themselves. Inside the bomb casing, live power is already racing toward the trigger, and it only takes one last switch to detonate. You'd think an explosion is guaranteed—except one thin wire snaps right before the current hits the core. If that wire hadn't broken first, a blast two hundred times stronger than Hiroshima would've wiped out miles of farmland in seconds—and sent fallout drifting straight over Washington. One lucky snapped wire stopped a disaster, and nobody on the ground even knew how close they'd come."
  controversy_comment_bait_engine:
    philosophy: "COUNTERFACTUAL HISTORICAL PARADOX: Highlight how razor-thin chance or one overlooked quirk changed everything—using natural spoken contractions and zero 'History books call it...' clichés!"
    bait_examples:
    - "Five out of six safety locks failed on impact—leaving just one thin low-voltage wire between North Carolina and a four-megaton blast."
    - "Had the wind blown forty miles south that afternoon, nuclear fallout from Chernobyl would've forced the evacuation of Minsk within twenty-four hours."
  viral_topic_bank_2026:
  - "What If You Had To Survive Every Worst Year in Human History? (536 AD to 1815)"
  - "What If You Were Inside the 1961 Goldsboro B-52 When Two 4-Megaton Nukes Fell?"
  - "1961 Goldsboro B-52 Crash: Two 4-Megaton Nukes vs. One Low-Voltage Switch in North Carolina"
  - "1958 Lituya Bay Mega-Tsunami: 1,720-Foot Wave vs. The Empire State Building"
  - "1986 Chernobyl Suicide Squad: 3 Divers vs. A 5-Megaton Thermal Explosion Under Europe"
  - "Project Habakkuk (1943): Britain's 2-Million-Ton Ice Aircraft Carrier vs. German U-Boats"
  - "Project A119 (1958): Why The US Air Force Secretly Planned To Nuke The Moon"
  - "1867 Alaska Purchase Blunder: What If Russia Kept Alaska's $700 Billion Oil & Gold Reserve?"
  - "1815 Mount Tambora Eruption: The Volcano That Cancelled Summer & Froze The World"
  - "Operation Plowshare: America's Plan To Carve A Canal With 520 Nuclear Bombs"
  - "1932 Great Emu War: 10,000 Machine Gun Rounds vs. 20,000 Unstoppable Birds"
  - "1908 Tunguska 15-Megaton Airburst: What If The Asteroid Hit 4 Hours Later Over Europe?"
  narrative_structure: "Act 1 (Scene 1, 0.0-4.0s): 6-12 Word In-Medias-Res Physical Clash / Split-Second Crisis Hook (NEVER repeats Title question) -> Act 2 (Scene 2, 4.0-9.0s): Urgent Present-Tense Cockpit/Room Physical Action & Asymmetric Disadvantage (STRICTLY FORBIDDEN to open Scene 2 with textbook calendar dates like 'It is May 1941...' or 'In 1912...'!) -> Act 3A (Scene 3, 9.0-14.5s): Why Normal Weapons/Defenses Fail in Plain $1 Words -> Act 3B (Scene 4, 14.5-20.0s): The 15-Second Mechanical Twist / Everyday Contrast Foil -> Act 4 (Scenes 5-6, 20.0-31.0s): The What-If Domino Chain Reaction or Fatal Physical Strike (Zero repetition of Scene 4!) -> Act 5 (Scene 7, 31.0-37.0s): Concrete Camera-Visible Physical Aftermath Mic-Drop (e.g., jammed rudder locking 50,000 tons in a circle — ZERO abstract 'doomed the pride of the fleet' summary!)"
  forbidden_words:
  - Welcome back to our channel
  - Today we will talk about
  - Thank you for watching
  - Don't forget to like and subscribe
  - Did you know
  - Have you ever wondered
  - Imagine a world where
  - Chào mừng các bạn đã quay trở lại
  cta_templates:
  - "Honestly: if Hannibal didn't have those 2,000 hidden cavalry in the riverbed, do the Romans win at Trebia? (1) Yes or (2) Hannibal still wins? 👇"
  - "If that final safety switch had failed in 1961, does the Cold War turn hot immediately: (1) Total War or (2) Emergency Stand-down? 👇"
  - "Was this turning point (1) Brilliant Strategy or (2) Pure Historical Luck? 👇"
  anti_hallucination_rules:
  - Phải dựa trên các sự kiện, thảm họa, chiến dịch quân sự có thật 100% trong lịch sử (năm, địa điểm, nhân vật), nhưng BẮT BUỘC miêu tả sức tàn phá/quy mô bằng hình ảnh đời thường sống động dễ mường tượng (TUYỆT ĐỐI KHÔNG ném các đơn vị vật lý khô khan như PSI, kPa, Newton, Joules vào lời thoại).
  - "Tiêu đề BẮT BUỘC nêu rõ Năm/Sự kiện/Nhân vật lịch sử hoặc câu hỏi 'What If...' sắc gọn dưới 58 ký tự (VD: 'What If the 1961 North Carolina Nukes Detonated? ☢️', '1815 Mount Tambora: The Volcano That Froze Summer 🌋'), TUYỆT ĐỐI KHÔNG đặt tiêu đề gượng gạo kiểu 'Person vs Switch' và tránh câu mở đầu học thuật dài dòng."
  - CẤM LẶP LẠI các chủ đề đã khai thác nhiều lần trên kênh (Cổng thành Constantinople 1453, Tài xế rẽ nhầm 1914, Sĩ quan Liên Xô Stanislav Petrov 1983 / Vasili Arkhipov 1962, Cháy thư viện Alexandria, Động cơ hơi nước Hero ở Rome).
  - TUYỆT ĐỐI KHÔNG làm nội dung về tiêm chích y tế (inject/vaccine), tội phạm giết người (serial killer/Ted Bundy), tài chính cá nhân, hay mẹo tâm lý học.
  banned_lexicon: &banned_words
  - buy now
  - link in bio
  - discount code
  - click here to buy
  - cheap price
  - inject
  - vaccine
  - syringe
  - needle
  - pandemic virus
  - burn the evidence
  - bloodbath
  - execution order
  - serial killer
  - ted bundy
  - narcissist
  - gaslighting
visual_aesthetics:
  art_style: Epic Historical Documentary Cinema, Declassified Cold War / Ancient Battle Visuals & 8K CGI Disaster Simulation (Zack D. Films / Christopher Nolan / Vox Atlas 8K aesthetic)
  camera_angles: Visceral eye-level impact shot at Frame 0.0s, grand sweeping aerial over historical catastrophe or battlefield, glowing 3D tactical map with shockwave radius, macro close-up on physical mechanism or detonator switch
  color_palette: Fiery amber gold, deep twilight royal blue, high-contrast archival steel, volcanic crimson, atmospheric smoke
  master_prompt_prefix: masterpiece historical documentary cinema still, breathtaking physical realism & high-contrast chiaroscuro lighting, 70mm IMAX & 8K CGI simulation aesthetic
  master_prompt_suffix: hyper-detailed textures of period-accurate military hardware, historical architecture, shockwaves and war maps, epic atmosphere, photorealistic vertical 9:16, no watermark, no text
  negative_prompts: modern computer keyboard, RGB gaming mouse, modern office desk, modern plastic gadgets, syringe, hospital, medical needle, cartoon, anime, chibi, blurry, low resolution, watermark, text, signature
  stock_video_keywords:
  - nuclear explosion mushroom cloud shockwave archival
  - giant ocean tsunami wave crashing storm
  - vintage military bomber aircraft flying clouds
  - erupting volcano lava ash lightning storm
  - ancient roman colosseum ruins dramatic sky
  - historic warship battleship firing cannon ocean
