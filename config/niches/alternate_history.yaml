id: alternate_history
name: Lịch Sử Giả Định & "What If?" (Alternate History & Paradoxes)
badge: ⏳ Alternate History & What If?
icon: ⏳
description: Khám phá các dòng thời gian song song, những bước ngoặt lịch sử bị đảo ngược (What If?), và thế giới sẽ ra sao nếu các sự kiện lớn diễn ra khác đi.
target_audience: Khán giả Mỹ và toàn cầu đam mê lịch sử, khoa học viễn tưởng, câu hỏi giả định và bí ẩn thời gian (18-45 tuổi).
script_blueprint:
  tone_of_voice: "Hồi hộp, sử thi, giọng kể tài liệu điện ảnh (Christopher Nolan / Dan Carlin), tạo cảm giác rùng mình trước sự mong manh của dòng thời gian."
  pacing: "Thời lượng vàng 35 - 45 giây (7 - 9 cảnh, 85 - 120 từ, 3.5 - 4.8 giây/cảnh). Cảnh 1 là Hook 3s giả định chấn động, Cảnh 4 (giây 12-15) là Mid-Video Re-Hook (Điểm rẽ nhánh lịch sử), Cảnh 5-7 là Payoff bản đồ thế giới bị viết lại."
  hook_formulas:
  - 'Modern Reality Anchor + Counterfactual Shock: ''Look at your smartphone — if one fire in 48 BC had been stopped, humanity would have landed on Mars by 1650...'''
  - 'Counter-Intuitive Disaster Paradox: ''What if the Titanic never hit the iceberg in 1912? Saving that ship would have triggered an even deadlier catastrophe...'''
  - '1-Minute Historical Butterfly Effect: ''In 1983, one Soviet officer refused to press a red button for 4 minutes — what if he followed orders?'''
  - 'Empire Survival Counterfactual: ''What if Alexander the Great survived his fever at 32 and marched his undefeated army straight into Rome?'''
  - 'The Wrong Turn of 1914: ''In 1914, a driver took one wrong turn down a side street — and accidentally erased four empires from existence...'''
  viral_topic_bank_2026:
  - "What If The Library Of Alexandria Never Burned Down? (The 1,000-Year Tech Leap)"
  - "What If The Titanic Never Hit The Iceberg In 1912? The Dark Paradox Nobody Tells You"
  - "What If A 15-Minute Rainstorm Missed Waterloo And Napoleon Conquered Europe?"
  - "What If Vasili Arkhipov Pressed The Launch Button Inside Submarine B-59 In 1962?"
  - "What If The Roman Empire Industrialized Hero's Steam Engine 1,800 Years Early?"
  - "What If Genghis Khan's Mongol Army Never Turned Back From Vienna In 1242?"
  - "What If Lincoln Cancelled His Theater Trip On April 14, 1865?"
  - "What If One Forgotten Gate In 1453 Had Been Locked Before The Siege Of Constantinople?"
  narrative_structure: "Beat 1 (0-3s): Counterfactual 'What If' Shock Hook anchored to modern life -> Beat 2 (3-11s): The Exact Historical Turning Point (Real Date, Real Figure, Real Decision) -> Beat 3 (11-22s): Mid-Video Re-Hook (The 3-Stage Butterfly Domino Effect rewriting world borders & technology) -> Beat 4 (22-36s): Mind-Bending Modern Payoff (What 2026 would look like today) + Seamless Loop Bridge"
  forbidden_words:
  - Welcome back to our channel
  - Today we will talk about
  - Thank you for watching
  - Don't forget to like and subscribe
  - Chào mừng các bạn đã quay trở lại
  cta_templates:
  - If this single turning point went the other way, would humanity today be 500 years ahead or in total chaos? Drop your theory! 👇
  - What would you have done if you stood in their shoes at that exact moment? Debate in the comments below 👇
  - Which fallen empire would dominate the modern world if it survived to 2026? Let's debate below 👇
  anti_hallucination_rules:
  - Phải dựa trên các đế chế, sự kiện, nhân vật và trận đánh lịch sử có thật (Rome, Alexandria, Napoleon, Alexander Đại Đế, Đế quốc Mông Cổ, Thế chiến), chỉ phân nhánh giả thuyết một cách logic, thuyết phục theo chuỗi nhân quả Domino 3 bước.
  - Tiêu đề hoặc câu Hook đầu tiên BẮT BUỘC phải đặt ra giả thuyết đảo ngược lịch sử rõ ràng ("What If...?" hoặc liên hệ trực tiếp thế giới năm 2026 bị thay đổi ra sao), tránh lối giảng sử sách giáo khoa khô khan.
  - TUYỆT ĐỐI KHÔNG làm nội dung về tiêm chích y tế (inject/vaccine), tội phạm giết người (serial killer/Ted Bundy), tài chính cá nhân, hay mẹo tâm lý học.
  banned_lexicon: &banned_words
  - buy now
  - link in bio
  - discount code
  - click here to buy
  - cheap price
  - inject
  - vaccine
  - syringe
  - needle
  - pandemic virus
  - burn the evidence
  - bloodbath
  - execution order
  - serial killer
  - ted bundy
  - narcissist
  - gaslighting
visual_aesthetics:
  art_style: Epic Alternate Reality Cinema, Historical War Room Maps & Neoclassical Retro-Futurism (Ridley Scott / Christopher Nolan / Vox Atlas 8K CGI aesthetic)
  camera_angles: Grand sweeping aerial over divergent civilization, glowing 3D animated geopolitical map with shifting empire borders, dramatic low-angle of historical figures facing temporal storm, macro close-up on antique hourglass and historical artifacts
  color_palette: Fiery amber gold, deep twilight royal blue, electric cyan timeline split, burnished antique bronze, atmospheric smoke
  master_prompt_prefix: masterpiece alternate history cinema still, breathtaking historical authenticity & timeline divergence, dramatic chiaroscuro lighting, 70mm IMAX & 8K CGI documentary aesthetic
  master_prompt_suffix: hyper-detailed textures of period-accurate ancient armor, stone architecture and historical war maps, epic atmosphere, photorealistic vertical 9:16, no watermark, no text
  negative_prompts: modern computer keyboard, RGB gaming mouse, modern office desk, modern skyscraper, modern cars, modern plastic gadgets, syringe, hospital, medical needle, cartoon, anime, chibi, blurry, low resolution, watermark, text, signature
  stock_video_keywords:
  - ancient roman colosseum ruins dramatic sky
  - medieval knights battle armor sword
  - glowing antique hourglass sand time
  - dramatic storm lightning over ancient temple
  - old vintage world map compass candlelight
  - historic cannon firing smoke battlefield
subtitles:
  font_family: Cinzel, Georgia, serif
  font_weight: '800'
  font_size: 42
  primary_color: '#FFF5E6'
  highlight_color: '#00E5FF'
  accent_color: '#FFB300'
  outline_color: '#0A0F1D'
  outline_width: 4
  margin_bottom: 640
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +9%
  pitch: -2Hz
  bgm_vibe: deep cinematic ticking clock, ominous orchestral brass, slow thunderous war drums
  sfx_cues:
  - impact_sub
  - riser
  - reveal
  - whoosh_heavy
banned_lexicon: *banned_words
target_wpm: 155
monetization:
  affiliate_enabled: false
  model: adsense_high_cpm_clean_metadata
