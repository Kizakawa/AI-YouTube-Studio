id: alternate_history
name: Lịch Sử Giả Định & "What If?" (Alternate History & Paradoxes)
badge: ⏳ Alternate History & What If?
icon: ⏳
description: Khám phá các dòng thời gian song song, những bước ngoặt lịch sử bị đảo ngược (What If?), và thế giới sẽ ra sao nếu các sự kiện lớn diễn ra khác đi.
target_audience: Khán giả Mỹ và toàn cầu đam mê lịch sử, khoa học viễn tưởng, câu hỏi giả định và bí ẩn thời gian (18-45 tuổi).
script_blueprint:
  tone_of_voice: "Hồi hộp, sử thi, giọng kể tài liệu điện ảnh (Christopher Nolan / Dan Carlin), tạo cảm giác rùng mình trước sự mong manh của dòng thời gian."
  pacing: "Thời lượng vàng 35 - 45 giây (7 - 9 cảnh, 85 - 120 từ, 3.5 - 4.8 giây/cảnh). Cảnh 1 là Hook 3s giả định chấn động, Cảnh 4 (giây 12-15) là Mid-Video Re-Hook (Điểm rẽ nhánh lịch sử), Cảnh 5-7 là Payoff bản đồ thế giới bị viết lại."
  hook_formulas:
  - '1-Minute Historical Butterfly Effect (Finances for Everyone 3.0M Formula): ''In 1983, one Soviet officer refused to press a red button for 4 minutes — and saved 6 billion lives...'''
  - 'Mightiest Armies Fatal Flaw (Proven #1 Winner 136 Views): ''When history''s mightiest unstoppable army made one fatal mistake, the map of the world changed forever...'''
  - 'Empire Wealth Flip (Proven #2 Winner 62 Views): ''How one ruthless decision turned a doomed oil empire into a $400 billion monopoly overnight...'''
  - 'The Wrong Turn of 1914: ''In 1914, a chauffeur took one wrong turn down a side street — and accidentally erased four empires from existence...'''
  - 'The Saved Ancient Supercomputer: ''What if the Library of Alexandria never burned, and the Industrial Revolution started in 100 AD?'''
  viral_topic_bank_2026:
  - "How One Wrong Turn By A Driver In 1914 Erased Four Empires Forever"
  - "What If The Titanic Never Hit The Iceberg? The Dark Truth Nobody Tells You"
  - "How A 15-Minute Rainstorm At Waterloo Ended Napoleon's Empire"
  - "The Man Who Refused To Launch A Nuclear Strike In 1962 Inside Submarine B-59"
  - "What If The Roman Empire Discovered Steam Engines 1,800 Years Early?"
  - "How The 1815 Tambora Volcano Eruption Created A Year Without A Summer"
  - "What If Lincoln Cancelled His Theater Trip On April 14, 1865?"
  - "How One Unlocked Gate In 1453 Ended The 1,000-Year Byzantine Empire"
  narrative_structure: "Shock Hook (Bước ngoặt đế chế/chiến dịch lịch sử 3s) -> Bằng chứng lịch sử thực tế -> Mid-Video Re-Hook (Cảnh 4 - Điểm rẽ nhánh đảo ngược định mệnh ở giây 12) -> Payoff (Thế giới hiện đại bị biến đổi hoàn toàn ở Cảnh 5-7) -> Câu hỏi tranh luận & CTA vòng lặp (Infinite Loop)"
  forbidden_words:
  - Welcome back to our channel
  - Today we will talk about
  - Thank you for watching
  - Don't forget to like and subscribe
  - Chào mừng các bạn đã quay trở lại
  cta_templates:
  - If this single turning point went the other way, would humanity today be 500 years ahead or in total chaos? Drop your theory! 👇
  - What would you have done if you stood in their shoes at that exact moment? Debate in the comments below 👇
  - Which fallen empire would dominate the modern world if it survived to 2026? Let's debate below 👇
  anti_hallucination_rules:
  - Phải dựa trên các đế chế, sự kiện, nhân vật và trận đánh lịch sử có thật (Rome, Alexandria, Napoleon, Alexander Đại Đế, Đế quốc Mông Cổ, Thế chiến), chỉ phân nhánh giả thuyết một cách logic, thuyết phục.
  - TUYỆT ĐỐI KHÔNG làm nội dung về tiêm chích y tế (inject/vaccine), thuyết âm mưu y khoa hiện đại, hay mẹo tâm lý học cá nhân.
  banned_lexicon: &banned_words
  - buy now
  - link in bio
  - discount code
  - click here to buy
  - cheap price
  - inject
  - vaccine
  - syringe
  - needle
  - pandemic virus
  - burn the evidence
  - narcissist
  - gaslighting
visual_aesthetics:
  art_style: Epic Alternate Reality Cinema & Neoclassical Retro-Futurism (Ridley Scott / Christopher Nolan aesthetic)
  camera_angles: Grand sweeping aerial over divergent civilization, dramatic low-angle of historical figures facing temporal storm, golden hour lightning split, dynamic close-up on antique hourglass cracking with glowing quantum particles
  color_palette: Fiery amber gold, deep twilight royal blue, electric cyan lightning, burnished antique bronze, atmospheric smoke
  master_prompt_prefix: masterpiece alternate history cinema still, breathtaking timeline divergence, dramatic chiaroscuro lighting, 70mm IMAX film aesthetic
  master_prompt_suffix: hyper-detailed textures of ancient stone and retro-futuristic machinery, epic atmosphere, photorealistic vertical 9:16, no watermark, no text
  negative_prompts: modern plastic gadgets, syringe, hospital, medical needle, cartoon, anime, 3d render, blurry, low resolution, watermark, text, signature
  stock_video_keywords:
  - ancient army battlefield dramatic sky
  - giant zeppelin airship over metropolis
  - glowing antique hourglass sand time
  - dramatic storm lightning over ancient ruins
  - old vintage map compass candlelight
subtitles:
  font_family: Cinzel, Georgia, serif
  font_weight: '800'
  font_size: 40
  primary_color: '#FFF5E6'
  highlight_color: '#00E5FF'
  accent_color: '#FFB300'
  outline_color: '#0A0F1D'
  outline_width: 3
  margin_bottom: 600
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +31%
  pitch: -2Hz
  bgm_vibe: deep cinematic ticking clock, ominous orchestral brass, slow thunderous war drums
  sfx_cues:
  - impact_sub
  - riser
  - reveal
  - whoosh_heavy
banned_lexicon: *banned_words
target_wpm: 190
monetization:
  affiliate_enabled: false
  model: adsense_high_cpm_clean_metadata
