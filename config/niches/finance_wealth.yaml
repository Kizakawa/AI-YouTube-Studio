id: finance_wealth
name: Tài Chính Thông Minh & Tư Duy Triệu Phú
badge: 💰 Tài Chính & Làm Giàu
icon: 💰
description: Vạch trần cạm bẫy tài chính, quy luật vận hành của tiền tệ, bài học đầu
  tư từ các tỷ phú và tư duy làm giàu của top 1%.
target_audience: Thế hệ trẻ Gen Z và Millennials quan tâm đến tự do tài chính, đầu
  tư, kinh doanh và tối ưu thu nhập.
script_blueprint:
  tone_of_voice: Đanh thép, sắc sảo, thực tế, bẻ gãy tư duy tài chính sai lầm, nói
    thẳng vào bản chất đồng tiền.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'Wealth Shock Hook: ''99% người nghèo tiếp tục mất tiền vì không biết quy tắc
    này của ngân hàng...'''
  - 'Billionaire Secret: ''Warren Buffett đã làm đúng 1 điều này ở tuổi 25 mà trường
    học chưa từng dạy bạn...'''
  - 'The Trap Exposed: ''Lý do bạn làm việc 12 tiếng một ngày nhưng ví vẫn rỗng không
    phải vì bạn lười...'''
  - 'Money Loophole: ''Cách giới siêu giàu tránh mất tiền hợp pháp mà người làm công
    không bao giờ biết...'''
  narrative_structure: Hook bẫy tiền bạc -> Số liệu/Bằng chứng thực tế gây sốc ->
    Bí mật phân tích dòng tiền -> 1 Quy tắc áp dụng ngay hôm nay -> CTA thử thách
    hành động & Infinite Loop
  forbidden_words:
  - Xin chào các nhà đầu tư thông minh
  - Hôm nay mình sẽ hướng dẫn kiếm tiền dễ dàng
  - Làm giàu không khó
  - Hãy đầu tư ngay hôm nay
  cta_templates:
  - "Nếu hôm nay có 100 triệu nhàn rỗi, bạn chọn (1) Tích sản lãi kép dài hạn hay (2) Kinh doanh xoay vòng vốn? Bình luận 1 hoặc 2 bên dưới! 👇"
  - "Theo bạn bẫy tiêu tiền nguy hiểm nhất với người trẻ là (1) Trả góp lãi ẩn hay (2) Mua sắm sĩ diện? 👇"
  anti_hallucination_rules:
  - Dẫn chứng chính xác tên nhà đầu tư (Warren Buffett, Charlie Munger, Ray Dalio,
    John Bogle), quy luật lãi kép, lạm phát.
  - Không hứa hẹn làm giàu sau một đêm, không shill coin rác hay đa cấp.
  banned_lexicon: &id001
  - deep ocean monster
  - haunted house
  - magic spell
  - ghost apparition
visual_aesthetics:
  art_style: High-End Corporate Noir & Luxury Modernist
  camera_angles: Low-angle skyscraper dolly, macro focus on shiny gold/platinum bullion,
    crisp modern minimalist studio
  color_palette: Matte carbon black, vibrant emerald green, burnished gold, high-contrast
    crisp white
  master_prompt_prefix: sleek ultra-luxurious corporate cinematic still, modern Wall
    Street skyscraper penthouse at dusk, emerald neon accents, 35mm crisp photography
  master_prompt_suffix: hyper-realistic glossy reflections, 8k resolution, razor-sharp
    textures, vertical 9:16 cinematography, no watermark, no text
  negative_prompts: cheap, dirty, cartoon, anime, hand drawing, blurry, low resolution,
    messy, watermark, text
  stock_video_keywords:
  - hands holding cash
  - stock market chart ticker
  - modern skyscraper penthouse
  - luxury watch wrist
  - gold bars vault
subtitles:
  font_family: Inter, Montserrat, sans-serif
  font_weight: '900'
  font_size: 56
  primary_color: '#FFFFFF'
  highlight_color: '#00FF88'
  accent_color: '#FFD700'
  outline_color: '#001A0D'
  outline_width: 3
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: 0Hz
  bgm_vibe: confident modern synthwave bass, sleek lo-fi tech groove, punchy kick
  sfx_cues:
  - cash_register
  - sub_bass_drop
  - digital_click
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
llm_production_blueprint:
  niche_overview: >
    Financial Traps, Institutional Money Mechanics & Billionaire Capital Allocation (Warren Buffett, Ray Dalio, Compounding,
    Inflation). Combines sleek Wall Street noir B-roll, gold vault bullion, printing presses, and 2D Doodle money-trap animations.
  video_search_strategy:
    dual_track_clash_rule: >
      NEVER put 'A vs B' or 'vs' in finance video searches (which triggers guru #edit / TikTok flex clips with burned-in subtitles).
      Search ONLY single concrete financial objects, Wall Street architecture, vault gold bullion, or use 2D Doodle money-scale metaphors!
    single_entity_body_scene_rule: >
      Every real-footage scene MUST search ONLY '[Single Concrete Financial Object / Building] + [Physical Action + Noir Lighting]' with ZERO 'vs' and ZERO abstract terms ('inflation', 'mindset', 'passive income').
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Concrete Money/Gold/Building Object] + [Action]' (e.g. 'gold bars vault', 'dollar printing press') with ZERO 'vs'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 Shorts AND 16:9 HD clean financial documentary B-roll (currency printing presses, gold vaults, Wall Street night aerials).
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      Reject fake-guru podcast talking heads, trading course screenshots, and burned-in caption reels; route abstract compounding/debt concepts to render_doodle_2d_explainer_scene!
    clash_query_examples:
    - "stock exchange trading floor bell"
    single_entity_query_examples:
    - "us dollar bills printing press machine"
    - "gold bullion bars vault closeup"
    - "wall street skyscraper night aerial"
    - "stock market ticker red crash screen"
    stock_fallback_examples:
    - "gold bars vault"
    - "wall street night aerial"
    - "counting cash bills dark"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#moneyedit"
    - "#sigmaedit"
    - "#capcut"
    - "#phonk"
    - "#veo"
    - "google veo"
    - "who would win"
    - "vs edit"
    forbidden_ai_slop_markers:
    - "#ai"
    - "#aivideo"
    - "#aigenerated"
    - "#sora"
    - "#kling"
    - "ai generated"
  visual_archetypes_and_tool_routing:
  - archetype: "1. Sleek Financial Documentary & Gold/Currency Hardware B-Roll"
    when_to_use: "Use for Scene 1-2 Opening Hook, institutional proof, and Final Scene."
    recommended_tool: "clone_youtube_short_peak_clip (or fetch_clean_cinematic_portrait_or_broll)"
    query_formula: "[Concrete Financial Object / Skyscraper / Vault] + [Physical Motion] (ZERO 'vs')"
  - archetype: "2. 2D Doodle Money Trap & Compounding Metaphor"
    when_to_use: "Use when explaining hidden interest traps, inflation erosion, or asset vs liability dynamics."
    recommended_tool: "render_doodle_2d_explainer_scene"
    query_formula: "character_tag (@MODERNYOU, @FARMER, @MANIPULATOR) + prop_type (money_scale, alarm, puppet_strings, split)"
  strictly_forbidden_visuals:
  - "Podcast/course-seller talking heads, cheesy smiling office workers, comparison #edit clips, or AI Veo watermarks"
