id: history_mystery
name: Lịch Sử Thế Giới & Bí Ẩn Chưa Có Lời Giải
badge: 📜 Lịch Sử & Bí Ẩn
icon: 📜
description: Khám phá bí mật lịch sử bị chôn vùi, lăng mộ cổ đại, các nền văn minh
  bí ẩn (Ai Cập, Atlantis) và các sự kiện kỳ bí có thật.
target_audience: Khán giả yêu thích khám phá lịch sử, khảo cổ, thuyết bí ẩn và những
  câu chuyện kỳ thú vượt thời gian.
script_blueprint:
  tone_of_voice: Hồi hộp, ly kỳ, như người dẫn chuyện phim tài liệu Discovery/BBC,
    kích thích trí tò mò, mở ra những bí mật chấn động.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'Lost Archive Shock: ''Năm 1922, khi các nhà khảo cổ phá niêm phong lăng mộ này,
    họ đã kinh hoàng phát hiện...'''
  - 'Censored History: ''Sự thật đen tối về [Sự kiện/Nhân vật] mà sách giáo khoa chưa
    từng kể cho bạn...'''
  - 'Impossible Artifact: ''Thứ được tìm thấy sâu 30 mét dưới lòng kim tự tháp đã
    thách thức toàn bộ khoa học hiện đại...'''
  - 'Last Words Mystery: ''Trước khi qua đời, hoàng đế [X] đã để lại một mật mã mà
    500 năm qua chưa ai giải được...'''
  narrative_structure: Hook bí mật bị chôn vùi -> Khám phá bằng chứng lịch sử gây
    sốc -> Tình tiết bất ngờ đảo ngược giả thuyết -> Câu hỏi mở kích thích bình luận
    & Infinite Loop
  forbidden_words:
  - Chào mừng các bạn quay lại với kênh lịch sử
  - Hôm nay chúng ta cùng tìm hiểu về
  - Cảm ơn các bạn đã theo dõi
  - Lịch sử thế giới rất phong phú
  cta_templates:
  - "Do you think this ancient monument was built with (1) Lost Forgotten Engineering or (2) Sheer Human Labor? Vote 1 or 2 below! 👇"
  - "If archaeologists opened that sealed chamber tomorrow, what is more likely inside: (1) Royal Relics or (2) A Historical Cover-Up? 👇"
  - "Was the official chronicle (1) Accurate History or (2) Rewritten by the Victors? 👇"
  anti_hallucination_rules:
  - Phải trích dẫn đúng mốc niên đại, tên nhân vật, địa danh khảo cổ có thật (như
    Howard Carter, Tutankhamun, Pompeii, Göbekli Tepe).
  - Phân biệt rõ giữa 'tài liệu lịch sử xác thực' và 'giả thuyết chưa được chứng minh'.
  banned_lexicon: &id001
  - smartphone
  - social media
  - internet
  - wifi
  - laptop
  - bitcoin
  - space rocket
visual_aesthetics:
  art_style: Epic Historical Cinema & Archival Realism (BBC / Ridley Scott Aesthetic)
  camera_angles: Grand sweeping aerial over ancient civilization, low-angle monumental temple entrance, golden dust rays illuminating ancient relic, dynamic close-up on historical artifact
  color_palette: Warm Egyptian desert gold, rich terracotta, lapis lazuli royal blue, glowing amber torchfire, oxidized ancient bronze
  master_prompt_prefix: masterpiece cinematic history film still, glorious golden desert sunlight, rich authentic archaeological detail, 35mm archival film aesthetic
  master_prompt_suffix: hyper-detailed ancient stone and gold textures, grand scale cinematography, vibrant atmospheric lighting, photorealistic vertical 9:16, no watermark, no text
  negative_prompts: modern city, plastic, digital gadgets, neon light, cartoon, anime, blurry, low resolution, watermark, text
  stock_video_keywords:
  - ancient pyramid desert sunset
  - archeologist holding torch relic
  - golden ancient treasure artifact
  - old parchment manuscript candle
  - aerial view ancient ruins
  - carved stone hieroglyphs wall
subtitles:
  font_family: Cinzel, Georgia, serif
  font_weight: '800'
  font_size: 56
  primary_color: '#FFF8E7'
  highlight_color: '#FFD700'
  accent_color: '#FF9900'
  outline_color: '#1A0F00'
  outline_width: 3
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-GuyNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: -3Hz
  bgm_vibe: epic orchestral mystery, ancient chanting, slow booming timpani drum
  sfx_cues:
  - ancient_gong
  - stone_door_creak
  - cinematic_swell
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
llm_production_blueprint:
  niche_overview: >
    Ancient Civilizations, Sealed Archaeological Tombs & Unsolved Historical Mysteries (Tutankhamun, Pompeii, Gobekli Tepe,
    Roman Empire, Lost Relics). Requires real archaeological expedition footage, ancient ruins aerials, and authentic artifacts.
  video_search_strategy:
    dual_track_clash_rule: >
      When a historical topic pits two empires/armies against each other (Empire A vs Empire B), probe at most 1 documented battle reenactment
      query alongside 3+ clean SINGLE-ENTITY archaeological ruin, artifact, or historical action queries; FAST-DROP 'A vs B' immediately if it returns #edit maps or AI Veo clips!
    single_entity_body_scene_rule: >
      Every body scene MUST search ONLY '[Single Monument / Civilization / Artifact] + [Real Expedition or Aerial Action]' with ZERO 'vs'.
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Ancient Monument or Artifact] + [Setting]' (e.g. 'egyptian pyramid sunset', 'ancient roman ruins') with ZERO 'vs'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 Shorts AND 16:9 HD/4K raw archaeological documentary, drone ruin aerials, and museum artifact footage.
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      Never mix modern skyscrapers, smartphones, or countryball/mapping #edit clips into ancient history scenes; keep all scenes grounded in authentic period ruins, excavations, and artifacts.
    clash_query_examples:
    - "roman legion battle reenactment"
    single_entity_query_examples:
    - "egyptian pyramid tomb excavation"
    - "pompeii ancient ruins aerial drone"
    - "gobekli tepe stone pillars excavation"
    - "ancient golden pharaoh mask closeup"
    stock_fallback_examples:
    - "ancient pyramid desert"
    - "archaeology ruins aerial"
    - "ancient stone hieroglyphs"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#vsedit"
    - "#historyedit"
    - "#countryballs"
    - "#mapping"
    - "#capcut"
    - "#phonk"
    - "#veo"
    - "google veo"
    - "who would win"
    - "who won"
    - "vs edit"
    forbidden_ai_slop_markers:
    - "#ai"
    - "#aivideo"
    - "#aishorts"
    - "#aigenerated"
    - "#sora"
    - "#kling"
    - "ai generated"
    - "ai video"
  visual_archetypes_and_tool_routing:
  - archetype: "1. Real Archaeological Expedition, Monument Aerials & Historical Reenactment"
    when_to_use: "Use for Scene 1-2 Opening Hook, Climax, and Ending scenes."
    recommended_tool: "clone_youtube_short_peak_clip"
    query_formula: "[Single Ancient Site / Civilization / Artifact] + [Expedition / Aerial / Reenactment Action] (ZERO 'vs')"
  - archetype: "2. Archival Manuscripts, Maps & Museum Relics"
    when_to_use: "Use ONLY on middle scenes (Scene 3-6) when depicting a specific historical manuscript, tomb map, or artifact."
    recommended_tool: "search_google_cinematic_image"
    query_formula: "[Specific Historical Relic / Manuscript + Era] (4-6 English words)"
  strictly_forbidden_visuals:
  - "Modern smartphones/offices, countryball #edit videos, AI Veo corner watermarks, or burned-in subtitles"
