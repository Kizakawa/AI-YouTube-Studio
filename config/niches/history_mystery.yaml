id: history_mystery
name: Lịch Sử Thế Giới & Bí Ẩn Chưa Có Lời Giải
badge: 📜 Lịch Sử & Bí Ẩn
icon: 📜
description: Khám phá bí mật lịch sử bị chôn vùi, lăng mộ cổ đại, các nền văn minh
  bí ẩn (Ai Cập, Atlantis) và các sự kiện kỳ bí có thật.
target_audience: Khán giả yêu thích khám phá lịch sử, khảo cổ, thuyết bí ẩn và những
  câu chuyện kỳ thú vượt thời gian.
script_blueprint:
  tone_of_voice: Hồi hộp, ly kỳ, như người dẫn chuyện phim tài liệu Discovery/BBC,
    kích thích trí tò mò, mở ra những bí mật chấn động.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'Lost Archive Shock: ''Năm 1922, khi các nhà khảo cổ phá niêm phong lăng mộ này,
    họ đã kinh hoàng phát hiện...'''
  - 'Censored History: ''Sự thật đen tối về [Sự kiện/Nhân vật] mà sách giáo khoa chưa
    từng kể cho bạn...'''
  - 'Impossible Artifact: ''Thứ được tìm thấy sâu 30 mét dưới lòng kim tự tháp đã
    thách thức toàn bộ khoa học hiện đại...'''
  - 'Last Words Mystery: ''Trước khi qua đời, hoàng đế [X] đã để lại một mật mã mà
    500 năm qua chưa ai giải được...'''
  narrative_structure: Hook bí mật bị chôn vùi -> Khám phá bằng chứng lịch sử gây
    sốc -> Tình tiết bất ngờ đảo ngược giả thuyết -> Câu hỏi mở kích thích bình luận
    & Infinite Loop
  forbidden_words:
  - Chào mừng các bạn quay lại với kênh lịch sử
  - Hôm nay chúng ta cùng tìm hiểu về
  - Cảm ơn các bạn đã theo dõi
  - Lịch sử thế giới rất phong phú
  cta_templates:
  - Empires crumble into dust, but the truth remains buried. Subscribe to uncover what history erased.
  - The official records were rewritten, yet the stone monuments still whisper the real secret. Subscribe so you never miss the untold truth.
  - History is written by the victors, but what they erased is the most dangerous truth. Follow to unmask the hidden archives.
  anti_hallucination_rules:
  - Phải trích dẫn đúng mốc niên đại, tên nhân vật, địa danh khảo cổ có thật (như
    Howard Carter, Tutankhamun, Pompeii, Göbekli Tepe).
  - Phân biệt rõ giữa 'tài liệu lịch sử xác thực' và 'giả thuyết chưa được chứng minh'.
  banned_lexicon: &id001
  - smartphone
  - social media
  - internet
  - wifi
  - laptop
  - bitcoin
  - space rocket
visual_aesthetics:
  art_style: Epic Historical Cinema & Archival Realism (BBC / Ridley Scott Aesthetic)
  camera_angles: Grand sweeping aerial over ancient civilization, low-angle monumental temple entrance, golden dust rays illuminating ancient relic, dynamic close-up on historical artifact
  color_palette: Warm Egyptian desert gold, rich terracotta, lapis lazuli royal blue, glowing amber torchfire, oxidized ancient bronze
  master_prompt_prefix: masterpiece cinematic history film still, glorious golden desert sunlight, rich authentic archaeological detail, 35mm archival film aesthetic
  master_prompt_suffix: hyper-detailed ancient stone and gold textures, grand scale cinematography, vibrant atmospheric lighting, photorealistic vertical 9:16, no watermark, no text
  negative_prompts: modern city, plastic, digital gadgets, neon light, cartoon, anime, blurry, low resolution, watermark, text
  stock_video_keywords:
  - ancient pyramid desert sunset
  - archeologist holding torch relic
  - golden ancient treasure artifact
  - old parchment manuscript candle
  - aerial view ancient ruins
  - carved stone hieroglyphs wall
subtitles:
  font_family: Cinzel, Georgia, serif
  font_weight: '800'
  font_size: 56
  primary_color: '#FFF8E7'
  highlight_color: '#FFD700'
  accent_color: '#FF9900'
  outline_color: '#1A0F00'
  outline_width: 3
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-GuyNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: -3Hz
  bgm_vibe: epic orchestral mystery, ancient chanting, slow booming timpani drum
  sfx_cues:
  - ancient_gong
  - stone_door_creak
  - cinematic_swell
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
