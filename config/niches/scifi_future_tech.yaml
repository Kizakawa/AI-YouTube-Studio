id: scifi_future_tech
name: Công Nghệ AI, Khoa Học & Tương Lai Viễn Tưởng
badge: 🚀 Công Nghệ & AI
icon: 🚀
description: Đột phá Trí tuệ Nhân tạo, robot hình người, thám hiểm không gian vũ trụ,
  máy tính lượng tử và viễn cảnh nhân loại năm 2050.
target_audience: Dân đam mê công nghệ, lập trình viên, người theo dõi xu hướng AI
  và khám phá tương lai.
script_blueprint:
  tone_of_voice: Kinh ngạc, dồn dập, cảnh báo tương lai, mở ra tầm nhìn đột phá làm
    rung chuyển cách thế giới vận hành.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'AI Takeover Shock: ''Chỉ trong 48 giờ qua, một AI bí mật đã tự viết lại mã nguồn
    và bắt đầu...'''
  - 'Timeline Warning: ''Năm 2030, 80% công việc văn phòng hiện tại sẽ biến mất vì
    công nghệ này...'''
  - 'Cosmic Mystery: ''Kính viễn vọng James Webb vừa bắt được một tín hiệu vô tuyến
    không thể giải thích từ...'''
  - 'Bio-Tech Breakthrough: ''Các nhà khoa học vừa tạo ra con chip cấy trực tiếp vào
    não cho phép...'''
  narrative_structure: Hook công nghệ gây sốc -> Minh họa sức mạnh vượt trội -> Tác
    động trực tiếp đến đời sống người xem -> Dự đoán viễn cảnh tương lai -> CTA đón
    đầu xu hướng & Infinite Loop
  forbidden_words:
  - Chào mừng các bạn đến với tin công nghệ hôm nay
  - AI đang phát triển rất mạnh mẽ
  - Công nghệ rất có ích cho con người
  - Cảm ơn các bạn đã theo dõi kênh
  cta_templates:
  - "Trong 5 năm tới, bạn nghĩ công nghệ này sẽ (1) Giải phóng con người hay (2) Thay thế 80% việc làm? Bình luận 1 hoặc 2 bên dưới! 👇"
  - "Nếu được cấy chip nâng cấp trí nhớ ngay ngày mai, bạn chọn (1) Thử ngay hay (2) Không bao giờ? 👇"
  anti_hallucination_rules:
  - Bám sát các mô hình AI có thật (GPT, Claude, Gemini, Sora, Tesla Optimus, Neuralink,
    Starship).
  - Không tung tin đồn vô căn cứ kiểu 'ngày tận thế tuần sau'.
  banned_lexicon: &id001
  - horse carriage
  - ancient pyramid
  - medieval sword
  - magic spell
  - witchcraft
visual_aesthetics:
  art_style: Cyberpunk Neon & Holographic Octane 3D
  camera_angles: Macro electronic microchip zoom, panoramic neon futuristic megacity,
    robotic optic lens scan
  color_palette: Cyber cyan, neon purple, electric blue, deep space void black, holographic
    iridescence
  master_prompt_prefix: futuristic scifi cinematic film still, neon cyberpunk metropolis,
    glowing holographic interfaces, advanced AI robotics, Octane render 8k
  master_prompt_suffix: volumetric laser lighting, hyper-realistic reflections, vertical
    9:16 cinematography, no text, no watermark
  negative_prompts: vintage, rustic, ancient, historical, cartoon, anime, blurry,
    low resolution, watermark, text
  stock_video_keywords:
  - hologram technology interface
  - robot humanoid walking
  - futuristic city night neon
  - microchip glowing circuit
  - deep space stars galaxy
subtitles:
  font_family: Orbitron, Montserrat, sans-serif
  font_weight: '900'
  font_size: 56
  primary_color: '#FFFFFF'
  highlight_color: '#00F0FF'
  accent_color: '#BF00FF'
  outline_color: '#001020'
  outline_width: 3
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-BrianNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: 0Hz
  bgm_vibe: futuristic synth pulse, cyberpunk electronic arpeggio, deep bass riser
  sfx_cues:
  - digital_glitch
  - laser_sweep
  - sci_fi_hum
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
llm_production_blueprint:
  niche_overview: >
    AI Robotics, Space Telescopes, Quantum Computing & 2050 Future Tech (Tesla Optimus, Figure 02, Starship, James Webb,
    Neuralink). Combines real hardware demo footage and NASA/ESA space visualizations.
  video_search_strategy:
    dual_track_clash_rule: >
      When comparing two technologies or rockets (e.g. Starship vs Saturn V, Optimus vs Atlas), probe at most 1 direct side-by-side hardware test
      query alongside 3+ clean SINGLE-ENTITY hardware/space footage queries; FAST-DROP 'A vs B' immediately if it returns fan #edit / phonk clips!
    single_entity_body_scene_rule: >
      Every body scene MUST search ONLY '[Single Robot / Spacecraft / Chip Hardware] + [Real Demo or Space Action]' with ZERO 'vs'.
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Single Tech Hardware or Space Object] + [Action]' (e.g. 'humanoid robot walking', 'rocket launch flame') with ZERO 'vs'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 Shorts AND 16:9 HD/4K official robotics lab demos, rocket launches, and NASA/ESA space telescope footage.
    allow_3d_cgi_video: true
    anti_flop_scene_continuity_rule: >
      Prefer official clean robotics/aerospace hardware tests and clean 3D space visualizations; reject talking-head tech reviewers and #edit TikTok overlays.
    clash_query_examples:
    - "boston dynamics atlas humanoid robot test"
    single_entity_query_examples:
    - "humanoid robot walking laboratory demo"
    - "spacex starship booster catch launch"
    - "james webb telescope deep space nebula"
    - "quantum computer golden chandelier lab"
    stock_fallback_examples:
    - "humanoid robot lab"
    - "microchip glowing circuit"
    - "deep space galaxy stars"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#vsedit"
    - "#capcut"
    - "#alightmotion"
    - "#phonk"
    - "#veo"
    - "#veo2"
    - "#veo3"
    - "google veo"
    - "who would win"
    - "who won"
    - "vs edit"
    forbidden_ai_slop_markers:
    - "#aishorts"
    - "made with veo"
  visual_archetypes_and_tool_routing:
  - archetype: "1. Real Robotics, Rocketry & Space Telescope Footage"
    when_to_use: "Use across Scene 1-2 Opening Hook, body hardware demos, and Final Scene."
    recommended_tool: "clone_youtube_short_peak_clip"
    query_formula: "[Specific Robot / Spacecraft / Chip] + [Physical Action / Lab Demo] (ZERO 'vs')"
  strictly_forbidden_visuals:
  - "Medieval/ancient props, tech YouTuber talking heads, comparison #edit clips, or AI Veo corner watermarks"
