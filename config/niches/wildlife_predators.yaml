id: wildlife_predators
name: Động Vật Săn Mồi Đỉnh Cao & Sinh Tồn Hoang Dã (Wild Odyssey)
badge: 🦁 Động Vật Săn Mồi
icon: 🦁
description: Khám phá sức mạnh nguyên thủy, chiến thuật săn mồi tàn khốc, chỉ số sinh tồn nghẹt thở (lực
  cắn, tốc độ bứt phá, nọc độc) và sự thống trị của các loài thú săn mồi đỉnh cao.
target_audience: Khán giả toàn cầu đam mê thế giới động vật hoang dã, phim tài liệu BBC Earth/National
  Geographic, các cuộc đối đầu sinh tử và quy luật tự nhiên khắc nghiệt.
script_blueprint:
  tone_of_voice: Trầm hùng, dồn dập, sắc bén, kích thích adrenaline tột độ, uy lực và tôn kính trước sự
    tàn khốc hoàn hảo của mẹ thiên nhiên.
  pacing: "Siêu cuốn hút, thời lượng vàng 34 - 42 giây (7 - 8 cảnh đầy đặn, 92 - 118 từ, ~4.5 giây/cảnh), nhịp điệu phim tài liệu kịch tính tối ưu đồng thời Stayed-to-Watch > 65% và APV 90-115%. QUY TẮC VÀNG MỞ ĐẦU 0.0s: Cả Tiêu đề (title) VÀ Cảnh 1 (0.0s-2.2s, 6-10 từ) ĐỀU BẮT BUỘC nêu đích danh Thực thể chính / Cặp đối đầu + Cú sốc vật lý hoặc Nghịch lý sinh tử ngay ở giây 0.0s! TUYỆT ĐỐI CẤM dùng câu chỉ trỏ mơ hồ giấu tên chủ thể ('Look closely at...', 'Watch the exact moment...') hoặc nhồi nhét nhiều vòng đấu (Round 1 -> Round 2 -> Round 3) trong Shorts 35s!"
  hook_formulas:
  - 'Direct Scale / Extreme Metric Clash (Proven Winner `A-oNKdpL0rM` 1,146 views & `w7iUy-8hjVo` 47.7% Stay): ''Fifteen hundred pounds of muscle crushes a four-hundred-pound lion.'' / ''Thirty thousand razor quills versus the deadliest jaws in Africa.'''
  - 'Walking Dead / Lethal Paradox with Named Entity (Proven Winner `1NeB0Qe6_t4` 1,325 views/12h): ''This twelve-hundred-pound buffalo walked away from a Komodo dragon, already dead.'''
  - 'Portuguese Direct Confrontation Paradox (Proven Winner `TXPjVAIaKWw` 40,225 views — 51.4% Stay, 79.1% APV): ''Esta mamba-negra mata em segundos, mas o mangusto ri do veneno!'''
  - 'The Fatal Mistake with Explicit Species (Proven Winner `XoeQ1I_WHsI` 2,700 views — 51.3% Stay): ''O último erro de qualquer predador é desafiar as garras desse casuar.'''
  - 'Surgical Predator Mechanism (Proven Winner `LLLIDVuvK8E` 1,220 views): ''The Jaguar doesn''t hunt like lions—it targets skull kill-switches.'''
  competitor_blueprint:
    benchmark_channel: "@FossilVideos (20.4M views across 14 videos — 'How Long You'd Last in Every Prehistoric Era' 12.08M, 'Could a Polar Bear Beat Every Ice Age Predator?' 1.99M)"
    long_form_archetypes:
    - "Archetype A — The Apex Gauntlet ('Could a [Predator] Beat Every Predator in [Biome/Continent]?'): Pit one iconic apex predator against 5 escalating opponents from Round 1 (Warm-Up Challenger) to Round 5 (The Ultimate Final Boss), analyzing weight, bite force PSI, armor, agility, and stamina in each round."
    - "Archetype B — Survival Duration Tier-List ('How Long You'd Last Against Every [Jungle/Savanna/River] Predator'): Rank survival time from 10 minutes down to 0.2 seconds across 5 deadly wildlife encounters with concrete biomechanical metrics."
    shorts_archetypes:
    - "Gauntlet Boss Round Extraction: Focus on the single most shocking asymmetric matchup from the Gauntlet (e.g. 'Jaguar vs 8 Giant River Otters', 'Honey Badger vs 6 Lions') with a 2-way counter-attack twist at Scene 4."
    round_or_chapter_progression: "0:00 Cold Open & Contender Stats -> Chapter 1 (Round 1: The Speed Challenger) -> Chapter 2 (Round 2: The Venom/Ambush Specialist) -> Chapter 3 (Round 3: The Armored Tank) -> Chapter 4 (Round 4: The Pack Threat) -> Chapter 5 (Final Boss & Ultimate Verdict)"
    thumbnail_hook_rule: "2-3 words MAX in massive White + Yellow/Red two-tone typography (e.g., 'TOO EASY?', 'SOLO ELITE?', 'ZERO CHANCE', '1,500 PSI!')"
  viral_topic_bank_2026:
  - 'Could a Jaguar Beat Every Predator in the African Savanna? (5-Round Gauntlet)'
  - 'How Long You Would Last Against Every Deadly Amazon River Predator'
  - 'Could a Siberian Tiger Beat Every Apex Predator in North America?'
  - 'Poderia uma Onça-Pintada Vencer Todos os Predadores da Savana Africana?'
  - 'Electric Eel vs Caiman: How An 860-Volt Biological Taser Stops A River Predator'
  - 'African Crested Porcupine vs Leopard: How 30,000 Razor Quills Stop An Ambush'
  - 'Cassowary: Why Nothing In The Jungle Messes With This 130-Pound Dinosaur Bird'
  - 'Secretary Bird vs Black Mamba: The 195-Newton Stomp In 15 Milliseconds'
  - Why A Pack Of Giant River Otters Can Drive A Jaguar Out Of Its Territory
  - 'Wolverine vs Grizzly Bear: Why 35 Pounds Of Fury Forces An 800lb Giant To Back Off'
  narrative_structure: "Cảnh 1 (0.0s-2.2s, 6-10 từ) - Nêu đích danh Thực thể chính / Cặp đối đầu + Thông số cực hạn hoặc Nghịch lý sinh tử ngay ở 0.0s (CẤM dùng 'Look closely at...' giấu chủ thể) -> Cảnh 2-3 (Act 2) - Giải phẫu vũ khí sinh học thứ nhất (PSI, km/h, Volt, mg độc tố) -> Cảnh 4-5 (Act 3 - Mid-Video 15s Twist) - Kẻ bị săn tung cơ chế phản đòn bất ngờ kèm thông số thứ 2 -> Cảnh 6-7 (Act 4 Payoff) - Đòn kết liễu sinh học xác thực -> Cảnh 8 (Act 5) - Cú chốt tự nhiên nối mượt về Cảnh 1 (Zero Spoken Subscribe CTA)"
  forbidden_words:
  - Chào mừng các bạn đến với thế giới động vật
  - Hôm nay chúng ta sẽ tìm hiểu về loài
  - Thiên nhiên thật kỳ diệu phải không các bạn
  - Hãy ấn theo dõi kênh để biết thêm nhiều loài vật
  - Như các nhà khoa học đã nghiên cứu
  - Welcome back to our channel
  - In today's video
  cta_templates:
  - 'Honestly: if two adult Caimans attacked at the exact same time, could the Jaguar still win in deep water? (1) Yes or (2) No chance? 👇'
  - 'If this fight happened in deep water instead of dry land, who survives: (1) The Challenger or (2) The Apex Predator? 👇'
  - 'Honestamente: se fossem dois jacarés adultos na água funda, a onça ainda venceria? (1) Sim ou (2) Sem chance? 👇'
  anti_hallucination_rules:
  - Mọi thông số sinh học (tốc độ tối đa, lực cắn PSI, chiều dài móng vuốt, nồng độ độc tố LD50) phải
    chuẩn xác theo tài liệu sinh học động vật thực tế.
  - Không phóng đại phi thực tế hay tạo ra các cuộc đối đầu phản tự nhiên.
  - TUYỆT ĐỐI KHÔNG gắn tên câu lạc bộ bóng đá (Bayern, Real Madrid...), thể thao, tâm lý học con người
    hay chính trị vào tiêu đề/kịch bản động vật.
  - BẮT BUỘC đặt tên cụ thể của loài thú săn mồi hoặc cặp đối đầu (A vs. B) ngay trên tiêu đề, cấm tiêu
    đề chung chung như 'Invisible Monsters'.
  banned_lexicon: &id001
  - pet salon
  - dog leash
  - office cubicle
  - supermarket
  - fashion show
  - bayern
  - football
  - soccer
  - stadium
  - fifa
  - champions league
  - ronaldo
  - messi
  - galaxy
  - black hole
  - narcissist
  - gaslighting
  - loud idiots
visual_aesthetics:
  art_style: Epic BBC Earth Wildlife Cinema & Hyper-Detailed High-Speed Action
  camera_angles: Low-angle dynamic tracking shot at predator eye level, slow-motion 1000fps water droplet
    splashing, extreme macro close-up of amber predator eyes and bared fangs, sweeping drone aerial savanna
    run
  color_palette: Dusty African savanna gold, deep jungle emerald, dark river mud, intense predator amber
    eyes, blood-tinged sunlit dust
  master_prompt_prefix: award-winning National Geographic wildlife photograph, vertical 8k film still,
    dramatic predatory intensity, golden hour dusty rim light, 400mm telephoto lens
  master_prompt_suffix: hyper-realistic animal anatomy, razor-sharp fur and claw details, motion blur
    background, photorealistic vertical 9:16, no text, no watermark
  negative_prompts: zoo cage, human, collar, domestic, friendly pet, cartoon, 3d render, anime, blurry,
    low resolution, watermark, text, soccer ball, stadium
  stock_video_keywords:
  - lion stalking savanna grass
  - cheetah running full speed slow motion
  - great white shark breach surface
  - crocodile attack water slow motion
  - eagle diving talons water
  - leopard jumping tree branch
  - wolf pack hunting snow
subtitles:
  font_family: Montserrat, Oswald, sans-serif
  font_weight: '900'
  font_size: 40
  primary_color: '#FFFFFF'
  highlight_color: '#FFAA00'
  accent_color: '#FF3300'
  outline_color: '#000000'
  outline_width: 3
  margin_bottom: 600
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +4%
  pitch: -2Hz
  bgm_vibe: primal tribal drums, accelerating heartbeat bass, intense suspense thriller orchestral, epic
    crescendo
  sfx_cues:
  - impact_sub
  - hit
  - whoosh_heavy
  - whoosh_fast
  - riser
banned_lexicon: *id001
target_wpm: 160
monetization:
  affiliate_enabled: false
llm_production_blueprint:
  niche_overview: >
    Apex Terrestrial Wildlife Predator Duels & Extreme Survival Mechanics (Jaguar vs Black Caiman, Honey Badger vs Lions,
    Peregrine Falcon 389 km/h Dive, Saltwater Crocodile 3,700 PSI). Must maintain >= 85% real moving wildlife footage
    with high-intensity physical strikes in the first 4.5-5.5 seconds.
  visual_archetypes_and_tool_routing:
  - archetype: "1. Real Wildlife Ambush, Strike & 1v1 Predator Confrontation"
    when_to_use: "Use for Scene 1-2 Opening Peak Hook and all action/climax/ending scenes."
    recommended_tool: "clone_youtube_short_peak_clip"
    query_formula: "[Exact Animal Species] + [Explosive Physical Verb + Natural Habitat] (e.g. 'jaguar attacking caiman river', 'honey badger fighting lions savanna', 'peregrine falcon high speed dive')"
  - archetype: "2. Close-Up Anatomical Weapon / Habitat B-Roll"
    when_to_use: "Use when a middle scene zooms in on claws, fangs, armor scales, or stealth stalking in native biome."
    recommended_tool: "clone_youtube_short_peak_clip (or search_pexels_pixabay_stock_video)"
    query_formula: "[Single Species Noun] + [Close Up / Stalking + Biome]"
  strictly_forbidden_visuals:
  - "Animals inside zoo cages, behind wire fences, or next to concrete walls"
  - "Domestic house cats, living-room pets, or clips with burned-in TikTok/Vietnamese subtitles"
