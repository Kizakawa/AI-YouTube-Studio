id: wildlife_predators
name: Động Vật Săn Mồi Đỉnh Cao & Sinh Tồn Hoang Dã (Wild Odyssey)
badge: 🦁 Động Vật Săn Mồi
icon: 🦁
description: Khám phá sức mạnh nguyên thủy, chiến thuật săn mồi tàn khốc, chỉ số sinh tồn nghẹt thở (lực
  cắn, tốc độ bứt phá, nọc độc) và sự thống trị của các loài thú săn mồi đỉnh cao.
target_audience: Khán giả toàn cầu đam mê thế giới động vật hoang dã, phim tài liệu BBC Earth/National
  Geographic, các cuộc đối đầu sinh tử và quy luật tự nhiên khắc nghiệt.
script_blueprint:
  tone_of_voice: Trầm hùng, dồn dập, sắc bén, kích thích adrenaline tột độ, uy lực và tôn kính trước sự
    tàn khốc hoàn hảo của mẹ thiên nhiên.
  pacing: Siêu cuốn hút, thời lượng vàng 35 - 42 giây (7 - 8 cảnh đầy đặn, 92 - 118 từ, ~4.5 giây/cảnh),
    nhịp điệu phim tài liệu kịch tính khớp chuẩn công thức ngày 21/10, tối ưu đồng thời Stayed-to-Watch
    > 50% và APV 70-95% (AVD 24-35s).
  hook_formulas:
  - 'Counter-Intuitive Apex Fear (Nature Lens 7.0M Formula): ''This is why 1,000-pound Caimans are terrified
    the second a Jaguar steps into the river...'''
  - 'Physics-Defying Survival (FleshlyPaws 12.7M Formula): ''When a Leopard leaps from a 50-foot tree
    branch, here is how it survives the impact without breaking a single bone...'''
  - 'Bite Force Skull-Piercer: ''With a bone-crushing 1,500 PSI bite force, the Jaguar ignores the throat
    and pierces straight through the skull...'''
  - 'Venom Immunity Shock: ''A single bite from a King Cobra drops an elephant in 3 hours — yet the Honey
    Badger wakes up and finishes its meal...'''
  viral_topic_bank_2026:
  - 'Electric Eel vs Caiman: How An 860-Volt Biological Taser Stops A River Predator'
  - 'African Crested Porcupine vs Leopard: How 30,000 Razor Quills Stop An Ambush'
  - 'Cassowary: Why Nothing In The Jungle Messes With This 130-Pound Dinosaur Bird'
  - 'Secretary Bird vs Black Mamba: The 195-Newton Stomp In 15 Milliseconds'
  - Why A Pack Of Giant River Otters Can Drive A Jaguar Out Of Its Territory
  - 'Wolverine vs Grizzly Bear: Why 35 Pounds Of Fury Forces An 800lb Giant To Back Off'
  - 'Orca Pod vs Great White Shark: The Tonic Immobility Surgical Ambush'
  narrative_structure: Hook đối đầu sinh tử cụ thể giữa 2 loài săn mồi kèm thông số vật lý ở 0.0s (5-8
    từ) -> So sánh vũ khí sinh học & cơ học sát thương -> Mid-Video Re-Hook (Cảnh 4 - Đòn đánh quyết định
    lật ngược thế cờ kèm chỉ số thứ 2) -> Kết cục tàn khốc của kẻ chiến thắng (Payoff Cảnh 5-6) -> Cú
    chốt Infinite Loop nối mượt về Cảnh 1 + HUD Badge nhắc bình chọn & Subscribe
  forbidden_words:
  - Chào mừng các bạn đến với thế giới động vật
  - Hôm nay chúng ta sẽ tìm hiểu về loài
  - Thiên nhiên thật kỳ diệu phải không các bạn
  - Hãy ấn theo dõi kênh để biết thêm nhiều loài vật
  - Như các nhà khoa học đã nghiên cứu
  - Welcome back to our channel
  - In today's video
  cta_templates:
  - 'Who takes the crown in this 1v1 survival showdown: (1) Predator or (2) Challenger? Drop your vote
    below & SUBSCRIBE for daily Apex Battles! 🦁🔥👇'
  - Could any predator survive a direct strike from this beast? Vote (1) YES or (2) NO in the comments
    & SUBSCRIBE for daily wildlife showdowns! 👇⚡
  - 'Quem vence esse duelo mortal na selva: (1) ou (2)? Deixe seu voto nos comentários e INSCREVA-SE para
    duelos diários! 👇🔥'
  anti_hallucination_rules:
  - Mọi thông số sinh học (tốc độ tối đa, lực cắn PSI, chiều dài móng vuốt, nồng độ độc tố LD50) phải
    chuẩn xác theo tài liệu sinh học động vật thực tế.
  - Không phóng đại phi thực tế hay tạo ra các cuộc đối đầu phản tự nhiên.
  - TUYỆT ĐỐI KHÔNG gắn tên câu lạc bộ bóng đá (Bayern, Real Madrid...), thể thao, tâm lý học con người
    hay chính trị vào tiêu đề/kịch bản động vật.
  - BẮT BUỘC đặt tên cụ thể của loài thú săn mồi hoặc cặp đối đầu (A vs. B) ngay trên tiêu đề, cấm tiêu
    đề chung chung như 'Invisible Monsters'.
  banned_lexicon: &id001
  - pet salon
  - dog leash
  - office cubicle
  - supermarket
  - fashion show
  - bayern
  - football
  - soccer
  - stadium
  - fifa
  - champions league
  - ronaldo
  - messi
  - galaxy
  - black hole
  - narcissist
  - gaslighting
  - loud idiots
visual_aesthetics:
  art_style: Epic BBC Earth Wildlife Cinema & Hyper-Detailed High-Speed Action
  camera_angles: Low-angle dynamic tracking shot at predator eye level, slow-motion 1000fps water droplet
    splashing, extreme macro close-up of amber predator eyes and bared fangs, sweeping drone aerial savanna
    run
  color_palette: Dusty African savanna gold, deep jungle emerald, dark river mud, intense predator amber
    eyes, blood-tinged sunlit dust
  master_prompt_prefix: award-winning National Geographic wildlife photograph, vertical 8k film still,
    dramatic predatory intensity, golden hour dusty rim light, 400mm telephoto lens
  master_prompt_suffix: hyper-realistic animal anatomy, razor-sharp fur and claw details, motion blur
    background, photorealistic vertical 9:16, no text, no watermark
  negative_prompts: zoo cage, human, collar, domestic, friendly pet, cartoon, 3d render, anime, blurry,
    low resolution, watermark, text, soccer ball, stadium
  stock_video_keywords:
  - lion stalking savanna grass
  - cheetah running full speed slow motion
  - great white shark breach surface
  - crocodile attack water slow motion
  - eagle diving talons water
  - leopard jumping tree branch
  - wolf pack hunting snow
subtitles:
  font_family: Montserrat, Oswald, sans-serif
  font_weight: '900'
  font_size: 40
  primary_color: '#FFFFFF'
  highlight_color: '#FFAA00'
  accent_color: '#FF3300'
  outline_color: '#000000'
  outline_width: 3
  margin_bottom: 600
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +4%
  pitch: -2Hz
  bgm_vibe: primal tribal drums, accelerating heartbeat bass, intense suspense thriller orchestral, epic
    crescendo
  sfx_cues:
  - impact_sub
  - hit
  - whoosh_heavy
  - whoosh_fast
  - riser
banned_lexicon: *id001
target_wpm: 160
monetization:
  affiliate_enabled: false
