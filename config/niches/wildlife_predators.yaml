llm_production_blueprint:
  niche_overview: >
    Apex Terrestrial Wildlife Predator Duels & Visceral Survival Mechanics (Jaguar vs Black Caiman skull-crushing ambush,
    Honey Badger vs Lions, Peregrine Falcon high-speed dive, Saltwater Crocodile death roll). Must maintain >= 85% real moving
    wildlife footage with high-intensity physical strikes in the first 4.5-5.5 seconds.
  video_search_strategy:
    dual_track_clash_rule: >
      When the script pits two animals against each other (Species A vs Species B), run DUAL-TRACK search in parallel on Opening Hook & Climax scenes:
      probe at most 1-2 genuine real-camera encounter queries ('[Species A] attacking [Species B]', '[Species A] vs [Species B]') alongside 3+ clean
      SINGLE-SPECIES real-action queries. If 'A vs B' yields no clean unedited real encounter clip, FAST-DROP 'A vs B' immediately and use clean single-species Peak footage!
    single_entity_body_scene_rule: >
      For every body scene focusing on ONE animal's weapon, bite force, movement, anatomy, or habitat, NEVER stuff 'A vs B' or 'vs' into
      visual_keyword or youtube_search_query (which lures #edit comparison videos and AI Veo/Sora clips). Search ONLY '[Single Canonical Species] + [Real Physical Action + Natural Habitat]'.
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Single Canonical Species Noun] + [Habitat or Visible Anatomical Feature]' with ZERO 'vs' / 'versus'.
      NEVER drop the head species noun (never write regional adjectives alone) and NEVER search generic material textures ('microscopic texture', 'needle macro').
    format_unlock_rule: >
      Search BOTH vertical 9:16 YouTube Shorts AND 16:9 HD/4K raw wildlife documentary/safari/drone recordings; prioritize clean unedited raw footage over heavily-edited comparison #shorts.
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      In a 2-species duel, set subject_entity to the exact active species in that scene OR 'Species A or Species B' so Vision accepts valid footage of either contender,
      while strictly rejecting unrelated ecological lookalikes (e.g. whale shark != bull shark, domestic cat != leopard) and captive zoo enclosures.
    clash_query_examples:
    - "jaguar attacking caiman river"
    - "crocodile vs bull shark"
    - "leopard attacking porcupine"
    - "honey badger fighting lions"
    single_entity_query_examples:
    - "saltwater crocodile swimming river"
    - "bull shark underwater"
    - "porcupine rattling quills closeup"
    - "pantanal jaguar hunting river"
    - "peregrine falcon high speed dive"
    stock_fallback_examples:
    - "saltwater crocodile river"
    - "bull shark underwater"
    - "porcupine quills closeup"
    - "leopard hunting savanna"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#vsedit"
    - "#vsedits"
    - "#capcut"
    - "#alightmotion"
    - "#aftereffects"
    - "#phonk"
    - "#veo"
    - "#veo2"
    - "#veo3"
    - "google veo"
    - "who would win"
    - "who wins"
    - "who won"
    - "who is the real king"
    - "vs edit"
    - "animal revolt"
    - "battle simulator"
    - "power scaling"
    - "debunked"
    forbidden_ai_slop_markers:
    - "#ai"
    - "#aivideo"
    - "#aishorts"
    - "#aigenerated"
    - "#sora"
    - "#kling"
    - "#klingai"
    - "#hailuo"
    - "#pika"
    - "#runwayml"
    - "ai generated"
    - "ai video"
    - "made with ai"
    - "sora ai"
    - "kling ai"
    - "hailuo ai"
  visual_archetypes_and_tool_routing:
  - archetype: "1. Real Wildlife Ambush, Strike & Dual-Track Predator Confrontation"
    when_to_use: "Use for Scene 1-2 Opening Peak Hook and Climax/Ending action scenes."
    recommended_tool: "clone_youtube_short_peak_clip"
    query_formula: "Dual-Track: probe '[Species A] attacking [Species B]' ONLY on direct clash scenes + '[Single Species] + [Explosive Verb + Natural Habitat]' (fast-drop 'A vs B' if not clean)"
  - archetype: "2. Single-Species Anatomical Weapon & Native Habitat Action"
    when_to_use: "Use on every body scene focusing on one contender's claws, fangs, quills, stealth stalking, or speed."
    recommended_tool: "clone_youtube_short_peak_clip (with single-species fallback_broad_query for Stock)"
    query_formula: "[Single Canonical Species Noun] + [Real Physical Action / Close-Up Feature + Biome] (ZERO 'vs')"
  strictly_forbidden_visuals:
  - "Animals inside zoo cages, behind wire fences, or next to concrete walls"
  - "Domestic house cats, living-room pets, comparison #edit split-screens, AI Veo corner watermarks, or burned-in subtitles"
