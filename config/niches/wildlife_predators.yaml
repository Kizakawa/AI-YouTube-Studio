id: wildlife_predators
name: Động Vật Săn Mồi Đỉnh Cao & Sinh Tồn Hoang Dã (Wild Odyssey)
badge: 🦁 Động Vật Săn Mồi
icon: 🦁
description: Khám phá sức mạnh nguyên thủy, chiến thuật săn mồi tàn khốc, chỉ số sinh tồn nghẹt thở (lực
  cắn, tốc độ bứt phá, nọc độc) và sự thống trị của các loài thú săn mồi đỉnh cao.
target_audience: Khán giả toàn cầu đam mê thế giới động vật hoang dã, phim tài liệu BBC Earth/National
  Geographic, các cuộc đối đầu sinh tử và quy luật tự nhiên khắc nghiệt.
script_blueprint:
  tone_of_voice: Trầm hùng, dồn dập, sắc bén, kích thích adrenaline tột độ, uy lực và tôn kính trước sự
    tàn khốc hoàn hảo của mẹ thiên nhiên.
  pacing: "Siêu cuốn hút, thời lượng vàng 34 - 42 giây (7 - 8 cảnh đầy đặn, 92 - 118 từ, ~4.5 giây/cảnh), nhịp điệu phim tài liệu kịch tính tối ưu đồng thời Stayed-to-Watch > 65% và APV 90-115%. QUY TẮC VÀNG MỞ ĐẦU 0.0s: Cả Tiêu đề (title) VÀ Cảnh 1 (0.0s-2.2s, 6-10 từ) ĐỀU BẮT BUỘC nêu đích danh Thực thể chính / Cặp đối đầu + Cú sốc vật lý hoặc Nghịch lý sinh tử ngay ở giây 0.0s! TUYỆT ĐỐI CẤM dùng câu chỉ trỏ mơ hồ giấu tên chủ thể ('Look closely at...', 'Watch the exact moment...') hoặc nhồi nhét nhiều vòng đấu (Round 1 -> Round 2 -> Round 3) trong Shorts 35s!"
  hook_formulas:
  - 'Direct Scale / Extreme Metric Clash (Proven Winner `A-oNKdpL0rM` 1,146 views & `w7iUy-8hjVo` 47.7% Stay): ''Fifteen hundred pounds of muscle crushes a four-hundred-pound lion.'' / ''Thirty thousand razor quills versus the deadliest jaws in Africa.'''
  - 'Walking Dead / Lethal Paradox with Named Entity (Proven Winner `1NeB0Qe6_t4` 1,325 views/12h): ''This twelve-hundred-pound buffalo walked away from a Komodo dragon, already dead.'''
  - 'Portuguese Direct Confrontation Paradox (Proven Winner `TXPjVAIaKWw` 40,225 views — 51.4% Stay, 79.1% APV): ''Esta mamba-negra mata em segundos, mas o mangusto ri do veneno!'''
  - 'The Fatal Mistake with Explicit Species (Proven Winner `XoeQ1I_WHsI` 2,700 views — 51.3% Stay): ''O último erro de qualquer predador é desafiar as garras desse casuar.'''
  - 'Surgical Predator Mechanism (Proven Winner `LLLIDVuvK8E` 1,220 views): ''The Jaguar doesn''t hunt like lions—it targets skull kill-switches.'''
  competitor_blueprint:
    benchmark_channel: "@FossilVideos (20.4M views across 14 videos — 'How Long You'd Last in Every Prehistoric Era' 12.08M, 'Could a Polar Bear Beat Every Ice Age Predator?' 1.99M)"
    long_form_archetypes:
    - "Archetype A — The Apex Gauntlet ('Could a [Predator] Beat Every Predator in [Biome/Continent]?'): Pit one iconic apex predator against 5 escalating opponents from Round 1 (Warm-Up Challenger) to Round 5 (The Ultimate Final Boss), breaking down size, bone-crushing weapons, armor, agility, and stamina through vivid everyday physical comparisons in each round."
    - "Archetype B — Survival Duration Tier-List ('How Long You'd Last Against Every [Jungle/Savanna/River] Predator'): Rank survival time from 10 minutes down to less than a blink across 5 deadly wildlife encounters with visceral, easy-to-picture physical consequences."
    shorts_archetypes:
    - "Gauntlet Boss Round Extraction: Focus on the single most shocking asymmetric matchup from the Gauntlet (e.g. 'Jaguar vs 8 Giant River Otters', 'Honey Badger vs 6 Lions') with a 2-way counter-attack twist at Scene 4."
    round_or_chapter_progression: "0:00 Cold Open & Contender Weapons -> Chapter 1 (Round 1: The Speed Challenger) -> Chapter 2 (Round 2: The Venom/Ambush Specialist) -> Chapter 3 (Round 3: The Armored Tank) -> Chapter 4 (Round 4: The Pack Threat) -> Chapter 5 (Final Boss & Ultimate Verdict)"
    thumbnail_hook_rule: "2-3 words MAX in massive White + Yellow/Red two-tone typography (e.g., 'TOO EASY?', 'SOLO ELITE?', 'ZERO CHANCE', 'CRUSHES SKULLS!')"
  showrunner_prose_dna:
    persona_and_voice: "High-Adrenaline, Visceral Wildlife Fight Commentator & Everyday Analogy Master (Casual Geographic / Hood Nature vivid street-smart analogies × TierZoo roast breakdown × @FossilVideos Gauntlet intensity)."
    writing_habits:
    - "1. ZERO ACADEMIC OPENERS & ZERO DRY PHYSICS UNITS (NO PSI / NO NEWTONS): NEVER start with 'Studies show...' or 'Estudos mostram que...', AND NEVER throw boring textbook physics units like '1,500 PSI', '195 Newtons', 'kPa', 'Joules', or 'LD50' at the viewer! Ordinary viewers have zero mental picture of a Newton or a PSI."
    - "2. MANDATORY EVERYDAY PHYSICAL ANALOGY ('THE MENTAL MOVIE RULE'): Translate every bite, kick, speed, weight, or venom into a visceral, everyday physical comparison that anyone can see, hear, and feel immediately (e.g., 'biting straight through an armored skull like teeth punching through a soda can', 'stomping down five times its body weight faster than you can blink—shattering spine bone like dry glass', 'claws the size of grizzly bear fingers that snap branches like toothpicks')."
    - "3. Zero Slow Nature Poetry: Never write textbook filler like 'Nature is full of amazing predators.' Every sentence must paint a concrete physical strike, anatomical weapon, or survival counter-move."
    - "4. Two-Way Counter-Build Twist: Establish Predator A's lethal weapon with a vivid physical image in Act 1–2, then flip the fight in Act 3 by revealing Opponent B's biological counter-weapon!"
    visceral_analogy_rules:
    - "Bite / Crushing Force -> NEVER say '1,500 PSI' or '3,700 PSI'. Say: 'enough jaw power to punch two fangs straight through a bowling ball / snap a turtle shell like a dry potato chip / crush bone like an empty tin can' (pt-BR: 'força para furar o crânio duro do jacaré como se fosse uma latinha de refrigerante / quebrar casco de tartaruga como biscoito seco')."
    - "Kick / Strike Impact -> NEVER say '195 Newtons'. Say: 'slamming down five times its own weight faster than a human blink—like dropping a steel sledgehammer onto a glass tube' (pt-BR: 'um pisão mais rápido que um piscar de olhos, descendo como uma marreta de aço sobre vidro')."
    - "Venom / Toxin -> NEVER say 'LD50 of 0.025 mg/kg'. Say: 'one drop turns thick blood into clotting jelly within minutes / shuts down breathing muscles while the prey is still standing' (pt-BR: 'uma única gota desliga os músculos da respiração antes mesmo da presa entender o que aconteceu')."
    bad_ai_slop_example: "Estudos de biomecânica mostram que a onça exerce 1.500 PSI e a ave-secretário chuta com 195 Newtons de força."
    good_million_view_example: "Lions spend ten minutes choking a prey's throat. The Pantanal Jaguar skips the neck entirely—punching its fangs straight through a caiman's armored skull like teeth piercing an empty soda can, shutting off the brain in one heartbeat."
    good_pt_br_example: "Enquanto os leões levam dez minutos tentando sufocar a garganta, a onça-pintada ignora o pescoço. Ela fura o crânio blindado do jacaré como se fosse uma latinha vazia, desligando o cérebro antes mesmo dele bater a cauda."
  controversy_comment_bait_engine:
    philosophy: "VIEWS & COMMENT WARS > POLITE NEUTRALITY (Cunningham's Law). Never give a neutral 'both animals are strong' verdict! Intentionally plant 1 bold, provocative 'Fanboy Trigger' claim in Scene 1 or Scene 4-5 that disrespects a fan-favorite predator or declares an audacious underdog win so lion/tiger/bear/shark fans argue furiously in the comments!"
    bait_examples:
    - "Pound for pound, the African Lion is the most overrated predator on Earth—and a Pantanal Jaguar would end it in ten seconds."
    - "A thirty-pound Honey Badger makes a four-hundred-pound Lion back down every single time."
    - "Quilo por quilo, o leão africano é o predador mais superestimado da Terra—e uma onça-pintada acabaria com ele em dez segundos."
  viral_topic_bank_2026:
  - 'Could a Jaguar Beat Every Predator in the African Savanna? (5-Round Gauntlet)'
  - 'How Long You Would Last Against Every Deadly Amazon River Predator'
  - 'Could a Siberian Tiger Beat Every Apex Predator in North America?'
  - 'Poderia uma Onça-Pintada Vencer Todos os Predadores da Savana Africana?'
  - 'Electric Eel vs Caiman: How A Living Underwater Taser Paralyzes A River Giant'
  - 'African Crested Porcupine vs Leopard: How 30,000 Razor Quills Ruin A Big Cat Ambush'
  - 'Cassowary: Why Nothing In The Jungle Messes With A Bird That Kicks Like A Dagger'
  - 'Secretary Bird vs Black Mamba: The Skull-Shattering Stomp Faster Than A Human Blink'
  - Why A Pack Of Giant River Otters Can Drive A Jaguar Out Of Its Own River
  - 'Wolverine vs Grizzly Bear: Why 35 Pounds Of Pure Fury Forces A Giant Bear To Back Off'
  narrative_structure: "Cảnh 1 (0.0s-2.2s, 6-10 từ) - Nêu đích danh Thực thể chính / Cặp đối đầu + Hình ảnh va chạm vật lý sống động hoặc Nghịch lý sinh tử ngay ở 0.0s (CẤM dùng 'Look closely at...' giấu chủ thể và CẤM nêu đơn vị vật lý khô khan như PSI, Newton) -> Cảnh 2-3 (Act 2) - Giải phẫu vũ khí sinh học thứ nhất bằng phép so sánh đời thường dễ mường tượng -> Cảnh 4-5 (Act 3 - Mid-Video 15s Twist) - Kẻ bị săn tung cơ chế phản đòn bất ngờ lật ngược thế cờ -> Cảnh 6-7 (Act 4 Payoff) - Đòn kết liễu sinh học sống động -> Cảnh 8 (Act 5) - Cú chốt tự nhiên nối mượt về Cảnh 1 (Zero Spoken Subscribe CTA)"
  forbidden_words:
  - Chào mừng các bạn đến với thế giới động vật
  - Hôm nay chúng ta sẽ tìm hiểu về loài
  - Thiên nhiên thật kỳ diệu phải không các bạn
  - Hãy ấn theo dõi kênh để biết thêm nhiều loài vật
  - Như các nhà khoa học đã nghiên cứu
  - Welcome back to our channel
  - In today's video
  cta_templates:
  - 'Honestly: if two adult Caimans attacked at the exact same time, could the Jaguar still win in deep water? (1) Yes or (2) No chance? 👇'
  - 'If this fight happened in deep water instead of dry land, who survives: (1) The Challenger or (2) The Apex Predator? 👇'
  - 'Honestamente: se fossem dois jacarés adultos na água funda, a onça ainda venceria? (1) Sim ou (2) Sem chance? 👇'
  anti_hallucination_rules:
  - Mọi cơ chế săn mồi (tốc độ lao xuống, cách nghiền xương, chiều dài móng vuốt, tác dụng thực tế của nọc độc) phải dựa trên tập tính sinh học có thật, nhưng BẮT BUỘC diễn đạt bằng hình ảnh so sánh đời thường dễ hiểu (TUYỆT ĐỐI KHÔNG đọc các đơn vị vật lý khô khan như PSI, Newton, kPa, LD50).
  - Không phóng đại phi thực tế hay tạo ra các cuộc đối đầu phản tự nhiên.
  - TUYỆT ĐỐI KHÔNG gắn tên câu lạc bộ bóng đá (Bayern, Real Madrid...), thể thao, tâm lý học con người
    hay chính trị vào tiêu đề/kịch bản động vật.
  - BẮT BUỘC đặt tên cụ thể của loài thú săn mồi hoặc cặp đối đầu (A vs. B) ngay trên tiêu đề, cấm tiêu
    đề chung chung như 'Invisible Monsters'.
