id: animal_rescue
name: Giải Cứu Động Vật & Phép Màu Tình Yêu (Paws & Hearts Rescue)
badge: 🐾 Giải Cứu Động Vật
icon: 🐾
description: Những câu chuyện giải cứu chó mèo bị bỏ rơi, phép màu phục hồi kỳ diệu
  từ đau khổ đến hạnh phúc, lan tỏa tình yêu thương và sự ấm áp chạm đáy tim.
target_audience: Hàng trăm triệu người yêu động vật toàn cầu, phụ nữ và gia đình từ
  16-65 tuổi, những người dễ rung động trước lòng trắc ẩn và sự chữa lành.
script_blueprint:
  tone_of_voice: Truyền cảm, ấm áp, thắt nghẹn ở phần đầu và vỡ òa xúc động ở phần
    kết, chạm thẳng vào trái tim người xem, kích hoạt phản xạ đồng cảm tức thì.
  pacing: Nhịp điệu xúc động sâu sắc, thời lượng tối ưu 45 - 55 giây (8 - 10 cảnh, 115 - 140 từ), cao trào thắt mở chạm tới trái tim người xem để đạt AWT tối đa.
  hook_formulas:
  - 'Relief Transformation: ''The exact second this terrified rescue dog realized he was finally safe, everything changed...'''
  - 'The Trembling Eye Contact: ''The exact moment she stopped shaking and dared to look into the rescuer\''s eyes, his heart melted...'''
  - 'Miracle Second Chance: ''The vet said he had less than 24 hours to live, but this puppy had a reason to fight...'''
  - 'Unconditional Trust: ''He hid inside this concrete pipe for 3 days refusing to look at anyone, until one gentle touch changed everything...'''
  - 'The Breakthrough Moment: ''He wouldn\''t let anyone touch him for months. But watch what happens when he hears her voice...'''
  narrative_structure: Ánh mắt sợ hãi e dè (Hook 0-5s) -> Bàn tay kiên nhẫn và thức ăn ấm áp tiếp cận (5-15s) -> Khoảnh khắc tan chảy nhận ra mình được yêu thương (15-30s) -> Sự lột xác rực rỡ và nụ cười hạnh phúc (Payoff 30-50s) -> Infinite Loop thiêng liêng.
  forbidden_words:
  - Chào mừng các bạn đến với kênh yêu thú cưng
  - Hôm nay mình sẽ kể cho các bạn nghe
  - Động vật là bạn của con người
  - Hãy like và subscribe ủng hộ trạm cứu hộ
  - Như chúng ta đã biết
  cta_templates:
  - From freezing in the dark to warm arms, every broken soul deserves love. Subscribe right now to help give more terrified animals a second chance.
  - And for the first time, his heartbeat slowed to gentle peace. Subscribe to help us save more innocent lives.
  - The road to healing was long, but today his eyes shine with hope. Follow right now to support our rescue journey.
  anti_hallucination_rules:
  - Kịch bản phải tôn trọng phẩm giá và sự an toàn của động vật, không khuyến khích
    hành vi gây hại hay dàn dựng cứu trợ độc hại.
  - Mô tả chân thực các triệu chứng phục hồi thú y (suy dinh dưỡng, hạ thân nhiệt,
    chấn thương, hồi sinh).
  banned_lexicon: &id001
  - hunting trophy
  - slaughterhouse
  - alien spacecraft
  - cyborg
  - cryptocurrency
visual_aesthetics:
  art_style: Warm Emotional Cinema & Golden Hour Tender Realism
  camera_angles: Low-angle eye-level macro close-up of pet eyes with tear reflection,
    shallow depth of field, gentle tracking shot of rescue hands, slow-motion running
    in sunlit meadow
  color_palette: Cold desaturated grey-blue in beginning (suffering), transitioning
    to warm golden amber, soft peach, vibrant meadow green (healing & joy)
  master_prompt_prefix: masterpiece 8k vertical film still, award-winning animal documentary
    photography, intense emotional resonance, soulful eyes reflecting golden light,
    35mm lens
  master_prompt_suffix: hyper-realistic fur texture, individual whiskers, warm cinematic
    backlight, photorealistic vertical 9:16, no text, no watermark, perfectly natural
    anatomy
  negative_prompts: ugly, deformed limbs, extra paws, distorted eyes, blood, gore,
    cartoon, 3d render, anime, blurry, low resolution, watermark, text
  stock_video_keywords:
  - sad puppy shaking rain
  - rescuer holding small dog
  - human hand petting scared dog
  - golden retriever puppy smiling
  - rescued dog running green field
  - cat purring closed eyes warm light
  - veterinarian caring injured puppy
subtitles:
  font_family: Outfit, Nunito, sans-serif
  font_weight: '900'
  font_size: 40
  primary_color: '#FFFFFF'
  highlight_color: '#FF8DA1'
  accent_color: '#FFD166'
  outline_color: '#2B1A1D'
  outline_width: 3
  margin_bottom: 600
audio:
  preferred_voice_en: en-US-JennyNeural
  preferred_voice_vi: vi-VN-HoaiMyNeural
  rate: -2%
  pitch: 0Hz
  bgm_vibe: emotional acoustic piano into soaring orchestral violin, heartwarming,
    tears of joy, gentle hopeful warmth
  sfx_cues:
  - heartbeat_soft
  - dog_whimper
  - gentle_piano_swell
  - tail_wag_thump
  - chime_miracle
banned_lexicon: *id001
target_wpm: 155
monetization:
  affiliate_enabled: false
  affiliate_category: pet_care

