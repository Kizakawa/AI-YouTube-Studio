id: animal_rescue
name: Giải Cứu Động Vật & Phép Màu Tình Yêu (Paws & Hearts Rescue)
badge: 🐾 Giải Cứu Động Vật
icon: 🐾
description: Những câu chuyện giải cứu chó mèo bị bỏ rơi, phép màu phục hồi kỳ diệu từ đau khổ đến hạnh
  phúc, lan tỏa tình yêu thương và sự ấm áp chạm đáy tim.
target_audience: Hàng trăm triệu người yêu động vật toàn cầu, phụ nữ và gia đình từ 16-65 tuổi, những
  người dễ rung động trước lòng trắc ẩn và sự chữa lành.
script_blueprint:
  tone_of_voice: Truyền cảm, ấm áp, thắt nghẹn ở phần đầu và vỡ òa xúc động ở phần kết, chạm thẳng vào
    trái tim người xem, kích hoạt phản xạ đồng cảm tức thì.
  pacing: "Nhịp điệu kể chuyện ấm áp, truyền cảm bằng giọng đọc thật (166 - 190 WPM, TUYỆT ĐỐI KHÔNG xuất video chỉ có nhạc nền không lời!), thời lượng vàng 35 - 42 giây (7 - 8 cảnh đầy đặn, 92 - 118 từ), đủ 4 giai đoạn chuyển hóa cảm xúc có mốc thời gian cụ thể theo công thức GeoBeats Animals (2.77M views, 10.84% Like) & Rocky Kanaka (645K views)."
  hook_formulas:
  - 'Time-Anchored Abandonment Hook (GeoBeats Animals 2.77M & 10.84% Like Formula): ''This senior shelter dog spent ten years alone in a concrete kennel without a soft bed.'''
  - 'Train Station / Street Discovery Hook (GeoBeats Animals 786K Formula): ''Nobody knew why this skinny stray puppy wouldn''t leave a freezing train platform.'''
  - 'The 50-Minute Shelter Trust Breakthrough (Rocky Kanaka 645K Formula): ''This terrified shelter dog wouldn''t let anyone touch him—until one volunteer sat silently on the floor.'''
  - 'Senior Street Cat Retirement (GeoBeats Animals 2.03M Formula): ''After years surviving out of trash cans, this scarred street cat walked onto the right porch.'''
  - 'Saved Mother Gratitude: ''Nobody knew why this stray mama dog kept barking in the rain beside a flooded pipe.'''
  viral_topic_bank_2026:
  - Stray Dog Refused To Stop Hugging The Rescuer Who Pulled Him Out Of The Storm
  - The Exact Second This Stray Mama Dog Realized Her Puppies Were Safe
  - Everyone Walked Past The Senior Shelter Dog Until One Man Read His Sign
  - Terrified Stray Puppy Fell Asleep In A Rescuer's Warm Hands For The First Time
  - Rescued Golden Retriever Reacts The First Time He Sees A Soft Bed
  - Stray Dog Guarded Her Injured Brother In The Rain Until Help Finally Arrived
  - 'Day 1 vs Day 30: The Stray Dog Nobody Wanted To Touch'
  narrative_structure: "Cảnh 1 (0.0s-2.2s, 8-12 từ) - Nêu đích danh con vật ('this stray dog', 'this tiny puppy' — CẤM mở đầu bằng đại từ 'He/She/It' mù chủ thể!) + địa điểm/thời gian cụ thể -> Cảnh 2-3 (Act 2) - Chi tiết hành vi nhỏ chân thực ngoài hiện trường -> Cảnh 4-5 (Act 3 - Mid-Video 15s Discovery/Trust Twist) - Khoảnh khắc người cứu hộ soi đèn/ngồi xuống và phát hiện sự thật bất ngờ -> Cảnh 6-7 (Act 4 Payoff) - Giải cứu thành công và cuộc sống ấm áp đời thường bên nhau (Zero Spoken Subscribe CTA)."
  showrunner_prose_dna:
    persona_and_voice: "Genuine, warm, grounded Human Rescuer Storyteller (The Dodo 801K × GeoBeats Animals 786K real-spoken warmth—zero melodramatic AI purple prose)."
    writing_habits:
    - "1. NAME THE ANIMAL IN 8–12 WORDS AT 0.0s + 6+ SPOKEN CONTRACTIONS THROUGH THE WHOLE STORY (The Dodo 801K Formula): NEVER start `title` or `Scene 1` with an unnamed pronoun ('He wouldn't...', 'She guarded...')! Keep Scene 1 tight (8–12 punchy spoken words naming the animal: 'Nobody knew why this stray dog wouldn't leave the park.'). Crucially, keep contractions flowing across BOTH the first half AND Scenes 4–7 ('wouldn't', 'didn't', 'couldn't', 'wasn't', 'that's when', 'he'd', 'he's', 'they're'—at least 5–6 contractions total!). NEVER drift into written novel prose in the middle ('Deep down in the dark tunnel, a muffled whine echoed...' -> say 'That's when she heard tiny cries coming from the dark water—and realized he wasn't guarding trash at all.'). Ban 'didn't budge', 'peered down into', front-loaded '-ing' openers ('Reaching down...'), 'vigil', and 'exact same'."
    - "2. TINY REAL BEHAVIORS & WARM CONVERSATIONAL PAYOFF WITH CONTRACTIONS: Show 100% observable actions a real rescuer sees on camera and end with warm spoken contractions ('Every time a car pulled in, he didn't run—he trotted right up to check the driver's window. Turns out his owners had left his old bed on the grass and driven off. When a volunteer sat down with warm food, he climbed straight into her lap—and now he's waiting by her front door every single afternoon.')."
    bad_ai_slop_example: "Amidst the torrential downpour, a shivering canine soul kept a silent vigil. Deep down in the dark concrete, a muffled sound echoed."
    good_million_view_example: "Nobody knew why this little stray dog wouldn't leave the park. Every time a car pulled in, he didn't bark or run—he trotted right up to check the driver's window. That's when someone spotted his old bed sitting beside him and realized his owners weren't coming back. When a volunteer sat on the grass with warm food, he couldn't stop wagging his tail and climbed straight into her lap. Now he's curled up on her couch every single afternoon—and doesn't have to wait in the rain anymore."
  controversy_comment_bait_engine:
    philosophy: "MORAL CONTRAST & EMPATHY TRIGGER: Highlight the stark contrast between hundreds of indifferent passersby walking past and the one rescuer who stopped, sparking massive comment engagement!"
    bait_examples:
    - "Dozens of cars pulled into that parking lot all afternoon without stopping once—until one stranger finally got out in the rain."
  forbidden_words:
  - Chào mừng các bạn đến với kênh yêu thú cưng
  - Hôm nay mình sẽ kể cho các bạn nghe
  - Động vật là bạn của con người
  - Hãy like và subscribe ủng hộ trạm cứu hộ
  - Như chúng ta đã biết
  - Welcome back to our channel
  cta_templates:
  - Look at his eyes at the end compared to the first second 🥺❤️ What would you name this brave little
    survivor? 👇
  - If you walked past that box in the rain, would you have stopped to help? Drop a ❤️ in the comments
    to wish him the happiest life! 👇
  - Have you ever adopted or rescued a stray pet? Share their transformation story in the comments below!
    🐾👇
  anti_hallucination_rules:
  - Kịch bản phải tôn trọng phẩm giá và sự an toàn của động vật, không khuyến khích hành vi gây hại hay
    dàn dựng cứu trợ độc hại.
  - TUYỆT ĐỐI KHÔNG đặt tiêu đề bi lụy/tuyệt vọng đơn thuần (như 'Frozen Puppy Found in Rain', 'Shivering
    Puppy Tied In Rain') mà thiếu vế hứa hẹn sự chuyển hóa/kỳ tích ('Until This Happened', 'The Moment
    He Realized He Was Safe').
  - BẮT BUỘC phải có phân cảnh Payoff phục hồi khỏe mạnh, hạnh phúc ở nửa cuối video (7-8 cảnh, 92-118
    từ).
  banned_lexicon: &id001
  - hunting trophy
  - slaughterhouse
  - alien spacecraft
  - cyborg
  - cryptocurrency
visual_aesthetics:
  art_style: Warm Emotional Cinema & Golden Hour Tender Realism
  camera_angles: Low-angle eye-level macro close-up of pet eyes with tear reflection, shallow depth of
    field, gentle tracking shot of rescue hands, slow-motion running in sunlit meadow
  color_palette: Cold desaturated grey-blue in beginning (suffering), transitioning to warm golden amber,
    soft peach, vibrant meadow green (healing & joy)
  master_prompt_prefix: masterpiece 8k vertical film still, award-winning animal documentary photography,
    intense emotional resonance, soulful eyes reflecting golden light, 35mm lens
  master_prompt_suffix: hyper-realistic fur texture, individual whiskers, warm cinematic backlight, photorealistic
    vertical 9:16, no text, no watermark, perfectly natural anatomy
  negative_prompts: ugly, deformed limbs, extra paws, distorted eyes, blood, gore, cartoon, 3d render,
    anime, blurry, low resolution, watermark, text
  stock_video_keywords:
  - sad puppy shaking rain
  - rescuer holding small dog
  - human hand petting scared dog
  - golden retriever puppy smiling
  - rescued dog running green field
  - cat purring closed eyes warm light
  - veterinarian caring injured puppy
subtitles:
  font_family: Outfit, Nunito, sans-serif
  font_weight: '900'
  font_size: 56
  primary_color: '#FFFFFF'
  highlight_color: '#FF8DA1'
  accent_color: '#FFD166'
  outline_color: '#2B1A1D'
  outline_width: 3
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-AvaMultilingualNeural
  preferred_voice_vi: vi-VN-HoaiMyNeural
  rate: +5%
  pitch: 0Hz
  bgm_vibe: emotional acoustic piano into soaring orchestral violin, heartwarming, tears of joy, gentle
    hopeful warmth
  sfx_cues:
  - hit
  - reveal
  - riser
  - whoosh_fast
banned_lexicon: *id001
target_wpm: 168
monetization:
  affiliate_enabled: false
  affiliate_category: pet_care
llm_production_blueprint:
  niche_overview: >
    Heartwarming Animal Rescue, Inter-Species Maternal Bonding & Vet Transformation Stories. Requires 100% authentic,
    emotional real-world footage of puppies, kittens, and rescued animals from Scene 1 to the final transformation.
  video_search_strategy:
    dual_track_clash_rule: >
      Even when titles use 'Day 1 vs Day 30', NEVER search 'vs' on YouTube or Stock! Only probe inter-species bonding ('mother dog nursing kitten')
      alongside single-animal rescue/transformation queries, and FAST-DROP any clip containing burned-in captions or AI Veo watermarks!
    single_entity_body_scene_rule: >
      Every scene MUST search ONLY '[Exact Breed + Coat Color Animal] + [Real Emotional State / Rescue Action + Setting]' with ZERO 'vs'.
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Exact Breed + Coat Color Puppy/Dog/Cat] + [Setting/Action]' with ZERO 'vs' / 'versus'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 rescue Shorts AND 16:9 HD clean shelter/vet camera recordings without burned-in story captions.
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      MANDATORY SINGLE-BREED & COAT-COLOR CONTINUITY across all scenes 1..N! Every scene's query and fallback stock query MUST lock onto
      the exact same breed and coat color (e.g. 'white poodle puppy' or 'golden retriever dog') so the video never stitches 8 different breeds together!
    clash_query_examples:
    - "mother dog nursing abandoned kitten"
    single_entity_query_examples:
    - "stray golden retriever shivering rain"
    - "rescuer wrapping wet puppy towel"
    - "veterinarian examining rescued golden puppy"
    - "golden retriever dog running sunny yard"
    stock_fallback_examples:
    - "golden retriever puppy rain"
    - "vet caring small puppy"
    - "happy golden retriever running"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#capcut"
    - "#veo"
    - "#veo2"
    - "#veo3"
    - "google veo"
    - "who would win"
    - "vs edit"
    forbidden_ai_slop_markers:
    - "#ai"
    - "#aivideo"
    - "#aishorts"
    - "#aigenerated"
    - "#sora"
    - "#kling"
    - "#hailuo"
    - "ai generated"
    - "ai video"
    - "made with ai"
  visual_archetypes_and_tool_routing:
  - archetype: "1. Real Emotional Rescue & Transformation Video (Single-Breed Continuity)"
    when_to_use: "Use across all scenes (Opening Hook, Vet Care, and Final Happy Transformation)."
    recommended_tool: "clone_youtube_short_peak_clip"
    query_formula: "[Locked Breed + Color Animal] + [Physical State/Action + Setting] (ZERO 'vs')"
  strictly_forbidden_visuals:
  - "Wild apex predators killing prey, AI-generated fake rescue clips, graphic gore, or text quote cards"
