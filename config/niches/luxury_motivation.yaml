id: luxury_motivation
name: Động Lực Thành Công & Lối Sống Thượng Lưu
badge: 👑 Động Lực & Thượng Lưu
icon: 👑
description: Kỷ luật thép, tư duy chiến binh, lối sống đỉnh cao của giới tinh hoa,
  siêu xe, chuyên cơ và hành trình vươn lên từ số 0.
target_audience: Người tham vọng, doanh nhân trẻ, những người đang khao khát bức phá
  giới hạn bản thân.
script_blueprint:
  tone_of_voice: Uy quyền, hừng hực lửa chiến binh, dứt khoát, không chấp nhận sự
    yếu đuối và viện cớ.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'Hard Reality Check: ''Sự thật tàn nhẫn: Không ai quan tâm đến khó khăn của bạn
    đâu, thế giới này chỉ nhìn vào...'''
  - 'Billionaire Discipline: ''Lý do 1% những người giàu nhất thức dậy lúc 4h30 sáng
    không phải vì tiền, mà là...'''
  - 'The Champion Law: ''Nếu bạn bỏ cuộc hôm nay, bạn đang tự tay nhường tương lai
    của mình cho...'''
  - 'Power Paradox: ''Người thành công nhất không phải người thông minh nhất, mà là
    người có khả năng chịu đau đớn khi...'''
  narrative_structure: Hook tát gáo nước lạnh thức tỉnh -> Phân tích khoảng cách giữa
    kẻ tầm thường và người xuất chúng -> Công thức kỷ luật thép -> Tuyên ngôn hành
    động ngay lúc này -> CTA kích hoạt ngọn lửa & Infinite Loop
  forbidden_words:
  - Chào các bạn chúc một ngày tốt lành
  - Mỗi ngày hãy cố gắng một chút
  - Cố lên bạn nhé
  - Đăng ký kênh ủng hộ mình
  cta_templates:
  - Nếu bạn chọn trở thành kẻ chiến thắng chứ không phải khán giả, nhấn thích và theo
    dõi kênh chiến binh.
  - Lưu video này để xem mỗi sáng thức dậy, và đăng ký kênh bước vào top 1%.
  anti_hallucination_rules:
  - Gắn liền với các câu chuyện có thật của huyền thoại thể thao & kinh doanh (Kobe
    Bryant, Michael Jordan, Elon Musk, David Goggins, Steve Jobs).
  banned_lexicon: &id001
  - slum
  - cheap plastic
  - dumpster
  - ocean monster
  - supernatural ghost
visual_aesthetics:
  art_style: High-Octane Cinematic Luxury & Golden Hour Grit
  camera_angles: Low-angle hero shot, macro sweat dripping during intense workout,
    sweeping aerial shot of matte black private jet on runway
  color_palette: Warm golden sunlight, obsidian carbon fiber, deep titanium gray,
    crisp tailored white
  master_prompt_prefix: hyper-luxurious cinematic action still, golden hour sunset,
    focused determined champion athlete, high-end billionaire aesthetic, 35mm film
  master_prompt_suffix: dramatic backlighting, razor-sharp textures, 8k resolution,
    vertical 9:16 cinematography, no watermark, no text
  negative_prompts: poor, lazy, depressing, cartoon, anime, blurry, low resolution,
    watermark, text
  stock_video_keywords:
  - athlete intense workout sweat
  - supercar driving sunset
  - businessman walking confident
  - private jet runway
  - boxer punching bag training
subtitles:
  font_family: Oswald, Impact, sans-serif
  font_weight: '900'
  font_size: 42
  primary_color: '#FFFFFF'
  highlight_color: '#FFD700'
  accent_color: '#FF4500'
  outline_color: '#000000'
  outline_width: 4
  margin_bottom: 600
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: -1Hz
  bgm_vibe: epic motivational cinematic drums, triumphant brass swell, driving bass
    hit
  sfx_cues:
  - cinematic_impact
  - heavy_gong
  - whoosh_fast
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
