id: luxury_motivation
name: Động Lực Thành Công & Lối Sống Thượng Lưu
badge: 👑 Động Lực & Thượng Lưu
icon: 👑
description: Kỷ luật thép, tư duy chiến binh, lối sống đỉnh cao của giới tinh hoa,
  siêu xe, chuyên cơ và hành trình vươn lên từ số 0.
target_audience: Người tham vọng, doanh nhân trẻ, những người đang khao khát bức phá
  giới hạn bản thân.
script_blueprint:
  tone_of_voice: Uy quyền, hừng hực lửa chiến binh, dứt khoát, không chấp nhận sự
    yếu đuối và viện cớ.
  pacing: Siêu nhanh 155 WPM, 2.5 - 3.2 giây/cảnh, nhịp điệu dồn dập, cao trào dồn
    nén.
  hook_formulas:
  - 'Hard Reality Check: ''Sự thật tàn nhẫn: Không ai quan tâm đến khó khăn của bạn
    đâu, thế giới này chỉ nhìn vào...'''
  - 'Billionaire Discipline: ''Lý do 1% những người giàu nhất thức dậy lúc 4h30 sáng
    không phải vì tiền, mà là...'''
  - 'The Champion Law: ''Nếu bạn bỏ cuộc hôm nay, bạn đang tự tay nhường tương lai
    của mình cho...'''
  - 'Power Paradox: ''Người thành công nhất không phải người thông minh nhất, mà là
    người có khả năng chịu đau đớn khi...'''
  narrative_structure: Hook tát gáo nước lạnh thức tỉnh -> Phân tích khoảng cách giữa
    kẻ tầm thường và người xuất chúng -> Công thức kỷ luật thép -> Tuyên ngôn hành
    động ngay lúc này -> CTA kích hoạt ngọn lửa & Infinite Loop
  forbidden_words:
  - Chào các bạn chúc một ngày tốt lành
  - Mỗi ngày hãy cố gắng một chút
  - Cố lên bạn nhé
  - Đăng ký kênh ủng hộ mình
  cta_templates:
  - "Sáng mai lúc 5 giờ chuông reo, bạn chọn (1) Bật dậy kỷ luật thép hay (2) Ngủ nướng thêm 30 phút? Bình luận 1 hoặc 2 bên dưới! 👇"
  - "Theo bạn thứ tạo ra khoảng cách lớn nhất sau 5 năm là (1) Tài năng bẩm sinh hay (2) Kỷ luật lặp lại mỗi ngày? 👇"
  anti_hallucination_rules:
  - Gắn liền với các câu chuyện có thật của huyền thoại thể thao & kinh doanh (Kobe
    Bryant, Michael Jordan, Elon Musk, David Goggins, Steve Jobs).
  banned_lexicon: &id001
  - slum
  - cheap plastic
  - dumpster
  - ocean monster
  - supernatural ghost
visual_aesthetics:
  art_style: High-Octane Cinematic Luxury & Golden Hour Grit
  camera_angles: Low-angle hero shot, macro sweat dripping during intense workout,
    sweeping aerial shot of matte black private jet on runway
  color_palette: Warm golden sunlight, obsidian carbon fiber, deep titanium gray,
    crisp tailored white
  master_prompt_prefix: hyper-luxurious cinematic action still, golden hour sunset,
    focused determined champion athlete, high-end billionaire aesthetic, 35mm film
  master_prompt_suffix: dramatic backlighting, razor-sharp textures, 8k resolution,
    vertical 9:16 cinematography, no watermark, no text
  negative_prompts: poor, lazy, depressing, cartoon, anime, blurry, low resolution,
    watermark, text
  stock_video_keywords:
  - athlete intense workout sweat
  - supercar driving sunset
  - businessman walking confident
  - private jet runway
  - boxer punching bag training
subtitles:
  font_family: Oswald, Impact, sans-serif
  font_weight: '900'
  font_size: 56
  primary_color: '#FFFFFF'
  highlight_color: '#FFD700'
  accent_color: '#FF4500'
  outline_color: '#000000'
  outline_width: 4
  margin_bottom: 420
audio:
  preferred_voice_en: en-US-ChristopherNeural
  preferred_voice_vi: vi-VN-NamMinhNeural
  rate: +0%
  pitch: -1Hz
  bgm_vibe: epic motivational cinematic drums, triumphant brass swell, driving bass
    hit
  sfx_cues:
  - cinematic_impact
  - heavy_gong
  - whoosh_fast
banned_lexicon: *id001
target_wpm: 145
monetization:
  affiliate_enabled: false
llm_production_blueprint:
  niche_overview: >
    Iron Discipline, Champion Mindset & High-Contrast Luxury Grit (Kobe Bryant, Michael Jordan, David Goggins).
    Requires clean, intense athletic training, solitary pre-dawn discipline, and sleek golden-hour cinematography without burned-in motivational captions.
  video_search_strategy:
    dual_track_clash_rule: >
      NEVER put 'A vs B' or 'vs' in motivation video searches (which triggers sigma/phonk #edit reels covered in flashing text).
      Search ONLY single high-grit athletic actions or clean luxury hardware cinematography!
    single_entity_body_scene_rule: >
      Every scene MUST search ONLY '[Single Athlete or Luxury Vehicle/Setting] + [Intense Physical Action + Dark/Golden Lighting]' with ZERO 'vs' and ZERO abstract words ('motivation', 'discipline', 'success').
    stock_and_fallback_rule: >
      Strictly 2-4 English words '[Single Athlete or Vehicle] + [Physical Action]' (e.g. 'boxer punching bag sweat', 'supercar sunset highway') with ZERO 'vs'.
    format_unlock_rule: >
      Search BOTH vertical 9:16 Shorts AND 16:9 HD clean commercial-grade sports/automotive cinematography without burned-in quote overlays.
    allow_3d_cgi_video: false
    anti_flop_scene_continuity_rule: >
      Strictly reject motivational speech talking heads with burned-in captions (#motivationedit, #sigmaedit); every clip must be 100% text-free physical grit or luxury motion.
    clash_query_examples:
    - "boxing sparring ring sweat slow motion"
    single_entity_query_examples:
    - "boxer punching heavy bag dark gym"
    - "sprinter starting blocks slow motion"
    - "athlete running rain pre dawn dark"
    - "matte black supercar driving sunset"
    stock_fallback_examples:
    - "boxer training dark gym"
    - "athlete sweat workout"
    - "private jet sunset runway"
    forbidden_edit_markers:
    - "#edit"
    - "#edits"
    - "#motivationedit"
    - "#sigmaedit"
    - "#capcut"
    - "#alightmotion"
    - "#phonk"
    - "#veo"
    - "google veo"
    - "who would win"
    - "quotes"
    forbidden_ai_slop_markers:
    - "#ai"
    - "#aivideo"
    - "#aigenerated"
    - "#sora"
    - "#kling"
    - "ai generated"
  visual_archetypes_and_tool_routing:
  - archetype: "1. High-Grit Athletic Discipline & Golden-Hour Luxury Motion"
    when_to_use: "Use across Scene 1 Hook, body grit scenes, and Final Scene."
    recommended_tool: "fetch_clean_cinematic_portrait_or_broll (media_preference='VIDEO_BROLL') or clone_youtube_short_peak_clip"
    query_formula: "[Athlete / Vehicle / Solitary Champion] + [Physical Action + Dark/Sunset Lighting] (ZERO 'vs' or 'motivation')"
  strictly_forbidden_visuals:
  - "Burned-in quote reels, podcast talking heads, #sigmaedit phonk clips, or AI Veo corner watermarks"
