# ==============================================================================
# CẤU HÌNH MẠNG LƯỚI ĐA KÊNH & CỤM TÀI KHOẢN GOOGLE ULTRA (MULTI-BRAND NETWORK)
# ==============================================================================
# Mỗi Tài khoản Google Ultra (Tài khoản mẹ) sở hữu 2TB Drive, Quota riêng và quản lý
# nhiều Kênh Thương Hiệu (Brand Channels) con với các chủ đề khác nhau.

google_accounts:
  - id: "account_1"
    email_label: "ultra_media_hub_1@gmail.com"
    drive_storage: "2 TB Google One"
    youtube_quota_daily: 10000
    credentials:
      client_secret: "credentials/accounts/account_1/client_secret.json"
      youtube_token: "credentials/accounts/account_1/youtube_token.json"
      drive_token: "credentials/accounts/account_1/drive_token.json"
    brand_channels:
      - id: "ch_dark_psychology"
        name: "Dark Psychology & Mind Hacks"
        niche: "psychology"
        language: "en"
        visual_mode: "imagen_ai" # Dùng AI Imagen 3 của Google Ultra
        preferred_voice: "en-US-ChristopherNeural"
        schedule:
          publish_hour_utc: 12
          days: ["monday", "wednesday", "friday", "sunday"]

      - id: "ch_stoic_wisdom"
        name: "Daily Stoic & Ancient Wisdom"
        niche: "philosophy"
        language: "en"
        visual_mode: "imagen_ai"
        preferred_voice: "en-US-GuyNeural"
        schedule:
          publish_hour_utc: 14
          days: ["tuesday", "thursday", "saturday"]

  - id: "account_2"
    email_label: "ultra_media_hub_2@gmail.com"
    drive_storage: "2 TB Google One"
    youtube_quota_daily: 10000
    credentials:
      client_secret: "credentials/accounts/account_2/client_secret.json"
      youtube_token: "credentials/accounts/account_2/youtube_token.json"
      drive_token: "credentials/accounts/account_2/drive_token.json"
    brand_channels:
      - id: "ch_space_cosmos"
        name: "Cosmic Odyssey & Space Secrets"
        niche: "space_science"
        language: "en"
        visual_mode: "imagen_ai"
        preferred_voice: "en-US-EricNeural"
        schedule:
          publish_hour_utc: 13
          days: ["monday", "thursday", "saturday"]

      - id: "ch_unsolved_mysteries"
        name: "History's Greatest Unsolved Mysteries"
        niche: "history_mystery"
        language: "en"
        visual_mode: "pexels_stock"
        preferred_voice: "en-US-ChristopherNeural"
        schedule:
          publish_hour_utc: 15
          days: ["wednesday", "sunday"]

# Khả năng tương thích ngược (Flat channels list)
channels:
  - id: "channel_psychology"
    name: "Dark Psychology & Mind Hacks"
    niche: "psychology"
    language: "en"
    google_account: "account_1"
    visual_mode: "imagen_ai"
    preferred_voice: "en-US-ChristopherNeural"

