name: 📊 7x Daily Standalone Channel Audit

on:
  schedule:
    # 7 khung giờ cố định mỗi ngày theo giờ Việt Nam (UTC+7):
    # 00:00 VN (17:00 UTC), 06:00 VN (23:00 UTC), 09:00 VN (02:00 UTC),
    # 12:00 VN (05:00 UTC), 15:00 VN (08:00 UTC), 18:00 VN (11:00 UTC), 21:00 VN (14:00 UTC)
    - cron: '0 2,5,8,11,14,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standalone-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Standalone Auditor
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/standalone_auditor

      - name: 🔄 Restore Previous Audit State (from isolated audit-logs branch)
        run: |
          git fetch origin audit-logs:audit-logs || true
          git checkout audit-logs -- tools/standalone_auditor/.audit_state.json 2>/dev/null || true

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚡ Install Minimal Standalone Dependencies
        run: |
          pip install --quiet pyyaml requests cryptography google-api-python-client google-auth google-auth-httplib2

      - name: 🔐 Unpack Encrypted YouTube Channel Credentials
        env:
          YT_CLOUD_CREDENTIALS_B64: ${{ secrets.YT_CLOUD_CREDENTIALS_B64 }}
        run: |
          python -c "
          import os, base64, io, zipfile
          raw = base64.b64decode(os.environ['YT_CLOUD_CREDENTIALS_B64'].strip())
          with zipfile.ZipFile(io.BytesIO(raw), 'r') as zf:
              zf.extractall('.')
          "

      - name: 🚀 Run Standalone Audit & Send to Telegram Group
        env:
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USERS: ${{ secrets.ALLOWED_TELEGRAM_USERS }}
          ALLOWED_TELEGRAM_GROUPS: ${{ secrets.ALLOWED_TELEGRAM_GROUPS }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
        run: |
          python tools/standalone_auditor/run_audit.py

      - name: 💾 Save State to Isolated `audit-logs` Branch (Zero impact on `main`)
        run: |
          git config user.name "Standalone Auditor"
          git config user.email "actions@github.com"
          git checkout --orphan temp-audit-branch
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f tools/standalone_auditor/.audit_state.json tools/standalone_auditor/LATEST_AUDIT_REPORT.md
          git commit -m "chore(audit-logs): snapshot channel audit state [skip ci]"
          git push origin HEAD:refs/heads/audit-logs --force
